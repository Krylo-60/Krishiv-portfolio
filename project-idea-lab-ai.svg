<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Idea Lab AI Preview</title>
  <desc id="desc">AI concept generator screen with saved idea database cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140b23"/>
      <stop offset="100%" stop-color="#0f3a56"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="66" y="62" width="1068" height="551" rx="28" fill="#0e1324" opacity="0.94"/>
  <text x="110" y="126" fill="#f0e9ff" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">Idea Lab AI</text>
  <text x="110" y="166" fill="#a8b8ff" font-family="Segoe UI, Arial, sans-serif" font-size="22">AI + Database Builder by Krishiv PB</text>
  <rect x="106" y="202" width="988" height="70" rx="14" fill="#151b31"/>
  <text x="136" y="246" fill="#dbe6ff" font-family="Segoe UI, Arial, sans-serif" font-size="22">Prompt: build a student app that helps manage exam stress and goals</text>
  <rect x="106" y="292" width="470" height="290" rx="18" fill="#151b31"/>
  <rect x="596" y="292" width="498" height="136" rx="18" fill="#151b31"/>
  <rect x="596" y="446" width="498" height="136" rx="18" fill="#151b31"/>
  <text x="136" y="340" fill="#f5f0ff" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600">Generated Idea</text>
  <text x="136" y="380" fill="#b8c8ee" font-family="Segoe UI, Arial, sans-serif" font-size="20">FocusForge: AI study coach + mood check-ins</text>
  <text x="136" y="414" fill="#b8c8ee" font-family="Segoe UI, Arial, sans-serif" font-size="20">- Adaptive focus blocks</text>
  <text x="136" y="446" fill="#b8c8ee" font-family="Segoe UI, Arial, sans-serif" font-size="20">- Burnout risk score</text>
  <text x="136" y="478" fill="#b8c8ee" font-family="Segoe UI, Arial, sans-serif" font-size="20">- Smart revision map</text>
  <rect x="136" y="516" width="170" height="36" rx="18" fill="url(#pulse)"/>
  <text x="178" y="540" fill="#0c1020" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Save Idea</text>
  <text x="626" y="336" fill="#f5f0ff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">Idea Database</text>
  <text x="626" y="372" fill="#b8c8ee" font-family="Segoe UI, Arial, sans-serif" font-size="20">1. FocusForge (saved)</text>
  <text x="626" y="404" fill="#b8c8ee" font-family="Segoe UI, Arial, sans-serif" font-size="20">2. QuizSprint (saved)</text>
  <text x="626" y="490" fill="#f5f0ff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">AI Endpoint</text>
  <text x="626" y="526" fill="#b8c8ee" font-family="Segoe UI, Arial, sans-serif" font-size="20">POST /api/ai/idea-suggest</text>
  <text x="626" y="558" fill="#b8c8ee" font-family="Segoe UI, Arial, sans-serif" font-size="20">GET /api/ideas | POST /api/ideas</text>
</svg>
