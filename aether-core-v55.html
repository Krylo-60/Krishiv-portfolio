<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Krishiv PB">
    <title>AETHER-TITAN v55.0 </title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --o: #ff4d00; --g: rgba(255, 77, 0, 0.3);
            --bg: #030303; --panel: #0a0a0a; --border: rgba(255, 77, 0, 0.2);
            --t: #ffffff; --s: #64748b; --f: rgba(255, 255, 255, 0.05);
            --red: #ff4444; --green: #00ff88;
        }
        [data-theme="light"] {
            --bg: #f8fafc; --panel: #ffffff; --border: #e2e8f0;
            --t: #0f172a; --s: #64748b; --f: rgba(0, 0, 0, 0.03);
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; transition: background 0.2s; }
        code, .status-log, .msg-label { font-family: 'JetBrains Mono', monospace; }
        
        body { margin: 0; padding: 0; height: 100vh; background: var(--bg); color: var(--t); display: flex; overflow: hidden; position: relative; }

        #matrix { position: fixed; inset: 0; z-index: -1; opacity: 0.1; display: none; }
        #destruct-overlay { position: fixed; inset: 0; background: rgba(255,0,0,0.2); display: none; z-index: 9998; pointer-events: none; animation: pulse 0.5s infinite; }
        @keyframes pulse { 0%{opacity:0} 50%{opacity:1} 100%{opacity:0} }

        #gate { position: fixed; inset: 0; background: #000; z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #gate input { background: transparent; border: 1px solid #222; color: var(--o); padding: 15px; text-align: center; font-size: 22px; width: 240px; border-radius: 8px; outline: none; letter-spacing: 6px; font-weight: bold; }

        .sidebar-l, .sidebar-r { width: 300px; background: var(--panel); border: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; z-index: 1; }
        .viewport { flex: 1; display: flex; flex-direction: column; background: var(--bg); z-index: 1; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
        .chat-wall { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }

        .master-badge { border-left: 3px solid var(--o); padding-left: 15px; margin-bottom: 25px; }
        .master-badge h1 { font-size: 10px; text-transform: uppercase; letter-spacing: 3px; color: var(--o); margin: 0; }
        .master-badge p { font-size: 18px; font-weight: 800; margin: 5px 0 0; }
        
        .metric-card { background: #0a0a0a; border: 1px solid #111; padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        .metric-val { font-size: 18px; font-weight: 900; color: var(--green); }

        .core-label { font-size: 9px; color: var(--s); font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; margin: 15px 0 10px; }
        .badge-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .badge { background: #111; border: 1px solid #222; padding: 8px; border-radius: 5px; text-align: center; opacity: 0.1; filter: grayscale(1); font-size: 18px; font-weight: 900; letter-spacing: 0.06em; }
        .badge.active { opacity: 1; filter: grayscale(0); border-color: var(--o); box-shadow: 0 0 10px var(--g); background: rgba(255, 77, 0, 0.1); }
        .badge svg { display: none; }
        .quick-pack { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }

        .msg-box { max-width: 90%; animation: slideUp 0.3s ease; position: relative; padding: 15px; background: var(--f); border-radius: 4px; border-left: 2px solid var(--o); }
        .msg-label { font-size: 9px; font-weight: 900; color: var(--o); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .user-msg { align-self: flex-end; border-left: none; border-right: 2px solid var(--s); text-align: right; }

        .neural-map { height: 100px; background: #000; border-radius: 8px; border: 1px solid var(--border); position: relative; overflow: hidden; margin-bottom: 15px; }
        .node-dot { position: absolute; width: 4px; height: 4px; background: var(--o); border-radius: 50%; box-shadow: 0 0 8px var(--o); transition: 3s linear; }
        
        .node-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .node-btn { background: #111; border: 1px solid #333; color: #444; padding: 6px; font-size: 8px; border-radius: 3px; font-weight: bold; }
        .node-btn.active { border-color: var(--o); color: var(--o); box-shadow: 0 0 10px var(--g); }
        .node-btn.online { color: var(--green); border-color: var(--green); }
        .node-btn.offline { color: var(--red); border-color: var(--red); }

        .status-log { font-size: 9px; color: #555; height: 160px; overflow-y: hidden; display: flex; flex-direction: column-reverse; background: #050505; padding: 10px; border: 1px solid #111; line-height: 1.6; }

        .input-bar { padding: 25px 10%; background: var(--panel); border-top: 1px solid var(--border); display: flex; gap: 15px; }
        input#userInput { flex: 1; background: transparent; border: 1px solid #222; border-radius: 4px; color: var(--t); padding: 12px; outline: none; }
        .ignite-btn { background: var(--o); color: #fff; border: none; padding: 12px 25px; font-size: 11px; font-weight: 900; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
        
        .rainbow-text { background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: rainbow 5s linear infinite; font-weight: 900; background-size: 200% auto; }
        @keyframes rainbow { to { background-position: 200% center; } }
    </style>
    <link rel="stylesheet" href="app-universe-shell.css" />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@400;500;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet" />
  <style id="codex-shared-fonts">
    body, button, input, select, textarea {
      font-family: "Space Grotesk", "Segoe UI", sans-serif !important;
    }

    h1, h2, h3, h4, h5, h6, .brand, .site-title, .logo-text {
      font-family: "Orbitron", "Space Grotesk", sans-serif !important;
    }

    code, pre, .mono, .eyebrow, .card-kicker, .mini-label {
      font-family: "JetBrains Mono", monospace !important;
    }
  </style>
</head>
<body data-theme="dark">

<canvas id="matrix"></canvas>
<div id="destruct-overlay"></div>

<div id="gate">
    <div style="font-size: 10px; letter-spacing: 5px; color: #444; margin-bottom: 20px;">CRYPTO_GATE_ACTIVE</div>
    <input type="password" id="pinCode" oninput="unlockSystem()" placeholder="â€¢â€¢â€¢â€¢â€¢">
</div>

<div class="sidebar-l">
    <div class="master-badge">
        <h1 id="rankTitle">Executive</h1>
        <p id="masterName">Krishiv PB</p>
    </div>

    <div class="metric-card">
        <div style="font-size: 8px; color: var(--s);">HEURISTIC_ACCURACY</div>
        <div class="metric-val" id="accMetric">99.8%</div>
    </div>
    
    <div class="core-label">Rank Achievements</div>
    <div class="badge-grid" id="badgeShelf">
        <div class="badge" title="The Founder">👑</div><div class="badge" title="Quantum Architect">⚛️</div>
        <div class="badge" title="Security Alpha">🛡️</div><div class="badge" title="Neural Sage">🧠</div>
        <div class="badge" title="Void Runner">🌌</div><div class="badge" title="Titan Overlord">🔱</div>
        <div class="badge" title="Singularity Point">🌀</div><div class="badge" title="Code Harbinger">⚡</div>
    </div>

    <div class="quick-pack">
        <button class="node-btn" onclick="missionPack('architecture')" style="cursor:pointer;">MISSION_ARC</button>
        <button class="node-btn" onclick="missionPack('debug')" style="cursor:pointer;">MISSION_DBG</button>
        <button class="node-btn" onclick="missionPack('optimize')" style="cursor:pointer;">MISSION_OPT</button>
        <button class="node-btn" onclick="exportStatusLog()" style="cursor:pointer;">EXPORT_LOG</button>
    </div>

    <button class="node-btn" onclick="toggleTheme()" style="width:100%; margin-top:20px; cursor:pointer;">THEME_SWAP</button>
    <button class="node-btn" onclick="creatorPanel()" style="width:100%; margin-top:8px; background:rgba(255,77,0,0.1); cursor:pointer;">OVERRIDE_AUTH</button>
    <button class="node-btn" onclick="scanNodes()" style="width:100%; margin-top:8px; color:var(--green); cursor:pointer;">FORCE_NODE_SYNC</button>
    
    <button onclick="lockdown()" style="width:100%; padding:10px; background:rgba(239,68,68,0.1); color:#ef4444; border:1px solid rgba(239,68,68,0.2); font-size:9px; font-weight:800; cursor:pointer; margin-top:auto;">TERMINAL_LOCKDOWN</button>
</div>

<div class="viewport">
    <div class="chat-wall" id="chatWall"></div>
    <div class="input-bar">
        <input type="text" id="userInput" placeholder="Synthesizing commands..." onkeypress="if(event.key==='Enter') execute()">
        <button class="ignite-btn" onclick="execute()">Ignite</button>
    </div>
</div>

<div class="sidebar-r">
    <div class="core-label">Neural Engine</div>
    <div class="neural-map" id="map"></div>
    
    <div class="core-label">25-Node Titan Array [v55.0]</div>
    <div class="node-grid" id="nodeGrid"></div>

    <div class="core-label">Latency Stream (ms)</div>
    <div class="status-log" id="statusLog"></div>
    
    <button onclick="selfDestruct()" style="background:rgba(255,68,68,0.05); color:var(--red); width:100%; margin-top:auto; font-size:8px; padding:12px; border:1px solid rgba(255,68,68,0.1); cursor:pointer; border-radius:4px;">EMERGENCY SELF DESTRUCT</button>
</div>

<script>
    const SECRET = "24714";
    const VIRTUAL_NODE_COUNT = 25;
    const PROMPT_HISTORY_KEY = 'aether_v55_prompt_history';
    
    let isGodMode = (localStorage.getItem('ignite_god') === 'true');
    let promptHistory = JSON.parse(localStorage.getItem(PROMPT_HISTORY_KEY) || '[]');
    let historyIndex = -1;

    const FESTIVALS = { 
        "1-13": "Lohri", "1-14": "Makar Sankranti", "1-23": "Vasant Panchami", "1-26": "Republic Day",
        "2-15": "Maha Shivaratri", "3-4": "Holi", "3-20": "Gudi Padwa", "3-29": "Ram Navami",
        "4-1": "Hanuman Jayanti", "7-24": "Master Krishiv's Birthday", "8-5": "Raksha Bandhan",
        "8-16": "Janmashtami", "8-27": "Ganesh Chaturthi", "10-21": "Dussehra", "11-9": "Diwali"
    };

    const grid = document.getElementById('nodeGrid');
    Array.from({ length: VIRTUAL_NODE_COUNT }).forEach((_, i) => {
        let b = document.createElement('button');
        b.className = 'node-btn'; b.id = `node${i}`; b.innerText = `N${i+1}`;
        grid.appendChild(b);
    });

    function pushLog(msg) {
        const log = document.getElementById('statusLog');
        log.innerHTML = `<div>[${performance.now().toFixed(2)}] > ${msg}</div>` + log.innerHTML;
    }

    async function scanNodes() {
        pushLog("INIT_ORCHESTRATION_SCAN...");
        for(let i=0; i<VIRTUAL_NODE_COUNT; i++) {
            const btn = document.getElementById(`node${i}`);
            setTimeout(() => { btn.classList.add('online'); pushLog(`NODE_${i+1}_STABLE`); }, i * 40);
        }
    }

    function toggleTheme() {
        const b = document.body;
        const next = b.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        b.setAttribute('data-theme', next);
    }

    function unlockSystem() {
        if(document.getElementById('pinCode').value === SECRET) {
            document.getElementById('gate').style.display = 'none';
            localStorage.setItem('ignite_locked', 'false');
        }
    }

    function lockdown() { localStorage.clear(); location.reload(); }

    function creatorPanel() {
        if(prompt("ROOT_PASSWORD:") === "KRISHIV") {
            isGodMode = true;
            localStorage.setItem('ignite_god', 'true');
            applyGodMode();
            pushLog("AUTHORIZATION_OVERRIDE_SUCCESS");
        }
    }

    function applyGodMode() {
        document.getElementById('rankTitle').innerText = "Master Coder";
        document.getElementById('masterName').innerText = "Krishiv PB";
        document.querySelectorAll('.badge').forEach(b => b.classList.add('active'));
        document.getElementById('matrix').style.display = "block";
        startMatrix();
    }

    function selfDestruct() {
        if(confirm("CRITICAL: ACTIVATE SELF DESTRUCT?")) {
            document.getElementById('destruct-overlay').style.display = 'block';
            pushLog("SYSTEM_ERASE_INITIATED");
            setTimeout(() => { lockdown(); }, 3000);
        }
    }

    async function attemptRequest(nodeIndex, val, loader) {
        if (nodeIndex >= VIRTUAL_NODE_COUNT) {
            loader.innerHTML = `<span style="color:var(--red);">[CRITICAL_FAULT]: ALL NODES EXHAUSTED</span>`;
            return;
        }

        const startTime = performance.now();
        document.querySelectorAll('.node-btn').forEach(b => b.classList.remove('active'));
        const btn = document.getElementById(`node${nodeIndex}`);
        if(btn) btn.classList.add('active');

        try {
            pushLog(`ROUTING_TO_N${nodeIndex+1} [BACKEND_GEMINI]`);

            const res = await fetch("/api/aether/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    prompt: val,
                    systemPrompt: "You are AETHER-TITAN v55.0, a high-performance orchestrator created by Krishiv PB. Answer in clear sections and keep strong technical style."
                })
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "NODE_REJECTED");

            const timeTaken = (performance.now() - startTime).toFixed(0);
            loader.innerHTML = marked.parse(data.text || "No response.");
            
            pushLog(`SYNC_COMPLETE [${timeTaken}ms]`);
            document.getElementById('accMetric').innerText = `${(99.6 + Math.random() * 0.3).toFixed(2)}%`;

        } catch(e) {
            if(btn) btn.className = "node-btn offline";
            pushLog(`N${nodeIndex+1}_FAULT: REROUTING...`);
            return await attemptRequest(nodeIndex + 1, val, loader);
        }
    }

    async function execute() {
        const input = document.getElementById('userInput');
        const val = input.value.trim();
        if(!val) return;
        promptHistory = [val, ...promptHistory.filter((item) => item !== val)].slice(0, 30);
        localStorage.setItem(PROMPT_HISTORY_KEY, JSON.stringify(promptHistory));
        historyIndex = -1;
        input.value = '';
        addMsg(val, "user");
        const loader = addMsg("<i>SYNTHESIZING_NEURAL_LOGIC...</i>", "bot");
        await attemptRequest(0, val, loader);
    }

    function recallPrompt(step) {
        const input = document.getElementById('userInput');
        if (!input || !promptHistory.length) return;
        if (historyIndex < 0) historyIndex = 0;
        else historyIndex = Math.min(promptHistory.length - 1, Math.max(0, historyIndex + step));
        input.value = promptHistory[historyIndex] || '';
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
    }

    function missionPack(type) {
        const input = document.getElementById('userInput');
        if (type === "architecture") input.value = "Design a scalable web architecture with modules, API routes, and deployment strategy.";
        if (type === "debug") input.value = "Debug this app flow and list likely bugs with direct fixes.";
        if (type === "optimize") input.value = "Optimize load speed, UX responsiveness, and reliability with exact steps.";
        input.focus();
    }

    function exportStatusLog() {
        const text = document.getElementById('statusLog').innerText.trim();
        if (!text) return;
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const href = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = href;
        link.download = `aether-v55-log-${Date.now()}.txt`;
        link.click();
        URL.revokeObjectURL(href);
    }

    function addMsg(t, type) {
        const div = document.createElement('div');
        div.className = `msg-box ${type}-msg`;
        const lbl = type === 'user' ? (isGodMode ? 'ARCHITECT' : 'EXECUTIVE') : 'AETHER-TITAN';
        div.innerHTML = `<div class="msg-label">${lbl}</div><div class="msg-content">${(type==='bot' && !t.includes('<i>')) ? marked.parse(t) : t}</div>`;
        document.getElementById('chatWall').appendChild(div);
        document.getElementById('chatWall').scrollTop = 99999;
        return div.querySelector('.msg-content');
    }

    function startMatrix() {
        const c=document.getElementById("matrix"), ctx=c.getContext("2d");
        c.width=window.innerWidth; c.height=window.innerHeight;
        const chars="01", columns=c.width/20, drops=[];
        for(let x=0;x<columns;x++) drops[x]=1;
        function draw(){
            ctx.fillStyle="rgba(0,0,0,0.05)"; ctx.fillRect(0,0,c.width,c.height);
            ctx.fillStyle="#ff4d00"; ctx.font="15px monospace";
            for(let i=0;i<drops.length;i++){
                ctx.fillText(chars[Math.floor(Math.random()*chars.length)],i*20,drops[i]*20);
                if(drops[i]*20>c.height&&Math.random()>0.975) drops[i]=0;
                drops[i]++;
            }
        }
        setInterval(draw, 33);
    }

    window.onload = () => {
        if(localStorage.getItem('ignite_locked') !== 'false') document.getElementById('gate').style.display = 'flex';
        const promptInput = document.getElementById('userInput');
        if (promptInput) {
            promptInput.addEventListener('keydown', (event) => {
                if (event.key === 'ArrowUp') {
                    event.preventDefault();
                    recallPrompt(1);
                    return;
                }
                if (event.key === 'ArrowDown') {
                    event.preventDefault();
                    if (historyIndex <= 0) {
                        historyIndex = -1;
                        promptInput.value = '';
                        return;
                    }
                    recallPrompt(-1);
                    return;
                }
                if (event.key === 'Tab' && !event.shiftKey) {
                    event.preventDefault();
                    recallPrompt(historyIndex < 0 ? 0 : 1);
                    return;
                }
                historyIndex = -1;
            });
        }
        
        const map = document.getElementById('map');
        for(let i=0; i<15; i++) {
            let n = document.createElement('div'); n.className = 'node-dot';
            n.style.left = Math.random()*100+'%'; n.style.top = Math.random()*100+'%';
            map.appendChild(n);
            setInterval(() => { n.style.left = Math.random()*100+'%'; n.style.top = Math.random()*100+'%'; }, 3000);
        }

        if(isGodMode) applyGodMode();

        const today = new Date();
        const dateKey = `${today.getMonth() + 1}-${today.getDate()}`;
        setTimeout(() => {
            if (FESTIVALS[dateKey]) addMsg(`<span class="rainbow-text">âœ¨ [FESTIVAL_ACTIVE]: Happy ${FESTIVALS[dateKey]}! âœ¨</span>`, "bot");
            pushLog("SYSTEM_BOOT_SUCCESS: v55.0_STABLE");
        }, 1000);
    };
</script>
<script src="app-universe-shell.js" defer></script>
</body>
</html>
