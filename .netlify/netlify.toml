[redirects.conditions]

[redirects.headers]

[[redirects]]
from = "/api/*"
to = "https://krishiv-new-portfoilo.vercel.app/api/:splat"
status = 200.0
force = true

[redirects.query]

[redirects.conditions]

[redirects.headers]

[[redirects]]
from = "/*"
to = "/:splat"
status = 200.0
