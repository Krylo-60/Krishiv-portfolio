<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Notes Vault Pro | Krishiv PB</title>
  <link rel="stylesheet" href="app-universe-shell.css"/>
  <link rel="icon" href="logo.svg" type="image/svg+xml"/>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@400;500;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;}body{margin:0;font-family:"Space Grotesk",sans-serif;color:#eef7ff;background:linear-gradient(160deg,#030a14,#0a223a 48%,#123860);min-height:100vh;}
    h1,h2{font-family:"Orbitron",sans-serif;margin:0 0 8px;}p{color:#a9c6e7;margin:0 0 8px;}
    .wrap{width:min(1100px,94%);margin:24px auto;}
    .card{border:1px solid #365f88;border-radius:14px;padding:20px;background:linear-gradient(160deg,rgba(18,40,68,.96),rgba(9,22,41,.96));margin-bottom:14px;}
    input,select,textarea{padding:10px;border-radius:10px;border:1px solid #365f88;background:#0a1b31;color:#eef7ff;font:inherit;transition:border-color .2s;width:100%;}
    input:focus,select:focus,textarea:focus{outline:none;border-color:#79d8ff;}
    .btn{cursor:pointer;font-weight:700;padding:10px 18px;border-radius:10px;border:none;transition:all .2s;font-family:inherit;}
    .btn.primary{background:linear-gradient(135deg,#79d8ff,#58d4a8);color:#032333;}
    .btn.sm{padding:6px 12px;font-size:.82rem;}
    .btn.ghost{background:transparent;border:1px solid #365f88;color:#a9c6e7;}
    .btn.danger{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.3);color:#ff9999;}
    .btn:hover{opacity:.85;transform:translateY(-1px);}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
    /* LAYOUT */
    .layout{display:grid;grid-template-columns:280px 1fr;gap:14px;}
    /* SIDEBAR */
    .note-list{max-height:calc(100vh - 280px);overflow-y:auto;}
    .note-item{border:1px solid rgba(84,126,171,.3);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;transition:all .2s;background:rgba(5,16,30,.5);}
    .note-item:hover,.note-item.active{border-color:#79d8ff;background:rgba(121,216,255,.07);}
    .note-item-title{font-weight:700;font-size:.88rem;margin:0 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .note-item-preview{font-size:.75rem;color:#a9c6e7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .note-item-meta{font-size:.7rem;color:#6b8fad;font-family:"JetBrains Mono",monospace;margin-top:4px;}
    /* EDITOR */
    .editor-wrap{display:flex;flex-direction:column;gap:10px;}
    .note-title-input{font-family:"Orbitron",sans-serif!important;font-size:1.2rem!important;font-weight:800!important;border:none!important;border-bottom:2px solid #365f88!important;border-radius:0!important;background:transparent!important;padding:8px 0!important;}
    .note-title-input:focus{border-bottom-color:#79d8ff!important;outline:none;}
    textarea.editor{min-height:400px;resize:vertical;font-family:"Space Grotesk",sans-serif;font-size:.95rem;line-height:1.7;border-radius:12px;}
    /* COLOR DOTS */
    .color-dots{display:flex;gap:6px;}
    .dot{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .2s;}
    .dot.active{border-color:#fff;transform:scale(1.2);}
    .tag-pills{display:flex;gap:5px;flex-wrap:wrap;}
    .tag-pill{padding:3px 9px;border-radius:999px;font-size:.72rem;font-family:"JetBrains Mono",monospace;background:rgba(121,216,255,.08);border:1px solid rgba(121,216,255,.2);color:#79d8ff;cursor:pointer;}
    .tag-pill:hover{background:rgba(121,216,255,.15);}
    .wc{font-size:.75rem;color:#6b8fad;font-family:"JetBrains Mono",monospace;}
    .empty{color:#a9c6e7;border:1px dashed #365f88;border-radius:12px;padding:30px;text-align:center;}
    .stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px;}
    .stat{font-size:.78rem;font-family:"JetBrains Mono",monospace;color:#79d8ff;}
    @media(max-width:760px){.layout{grid-template-columns:1fr;}.note-list{max-height:260px;}}
  </style>
</head>
<body>
<main class="wrap">
  <section class="card" style="padding:14px 20px;">
    <div class="row" style="justify-content:space-between;">
      <div><h1>📝 Notes Vault Pro</h1><p style="margin:0;">Write, organise, pin. All saved locally.</p></div>
      <a href="index.html" style="color:#9edcff;font-size:.85rem;">← Back</a>
    </div>
    <div class="stats" id="statsBar" style="margin-top:10px;"></div>
  </section>

  <div class="layout">
    <!-- SIDEBAR -->
    <div>
      <div class="row" style="margin-bottom:10px;">
        <input id="searchNotes" placeholder="Search notes..." style="flex:1;"/>
        <button class="btn primary sm" id="newNoteBtn">+ New</button>
      </div>
      <div style="margin-bottom:8px;">
        <select id="filterTag">
          <option value="">All tags</option>
        </select>
      </div>
      <div class="note-list" id="noteList"></div>
    </div>

    <!-- EDITOR -->
    <div class="card editor-wrap" id="editorPanel">
      <div style="text-align:center;color:#6b8fad;padding:40px;">
        <div style="font-size:2rem;margin-bottom:8px;">📝</div>
        Select a note or create one
      </div>
    </div>
  </div>
</main>

<script>
(() => {
  const LSK = 'krishiv_nv_v2';
  let notes = [], activeId = null;
  const COLORS = ['#0a1b31','#1a0a31','#0a1f14','#1a1203','#1a0a0a','#0a1a28'];
  const COLOR_LABELS = ['Default','Purple','Green','Gold','Red','Teal'];
  const COLOR_DOTS = ['#79d8ff','#b47dff','#56d5a6','#ffd166','#ff6b6b','#47d3a5'];

  function load(){try{notes=JSON.parse(localStorage.getItem(LSK)||'[]');if(!Array.isArray(notes))notes=[];}catch{notes=[];}}
  function save(){localStorage.setItem(LSK,JSON.stringify(notes));}
  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function wc(s){return s.trim()?s.trim().split(/\s+/).length:0;}
  function timeAgo(ts){
    const d=Date.now()-ts;
    if(d<60000)return 'just now';
    if(d<3600000)return Math.floor(d/60000)+'m ago';
    if(d<86400000)return Math.floor(d/3600000)+'h ago';
    return Math.floor(d/86400000)+'d ago';
  }

  function newNote(){
    const n={id:Date.now().toString(36),title:'Untitled',body:'',color:0,tags:[],pinned:false,ts:Date.now(),modified:Date.now()};
    notes.unshift(n);save();activeId=n.id;render();renderEditor();
  }

  function renderStats(){
    const el=document.getElementById('statsBar');
    const totalWords=notes.reduce((a,n)=>a+wc(n.body),0);
    el.innerHTML=`<span class="stat">📝 ${notes.length} notes</span><span class="stat">📌 ${notes.filter(n=>n.pinned).length} pinned</span><span class="stat">✍️ ${totalWords.toLocaleString()} words</span>`;
  }

  function updateTagFilter(){
    const allTags=[...new Set(notes.flatMap(n=>n.tags))].sort();
    const sel=document.getElementById('filterTag');
    const cur=sel.value;
    sel.innerHTML='<option value="">All tags</option>'+allTags.map(t=>`<option${t===cur?' selected':''}>${esc(t)}</option>`).join('');
  }

  function render(){
    const q=document.getElementById('searchNotes').value.toLowerCase();
    const tf=document.getElementById('filterTag').value;
    let vis=notes.filter(n=>{
      if(tf&&!n.tags.includes(tf))return false;
      if(q&&!(n.title+n.body+n.tags.join(' ')).toLowerCase().includes(q))return false;
      return true;
    });
    const pinned=vis.filter(n=>n.pinned);
    const rest=vis.filter(n=>!n.pinned);
    vis=[...pinned,...rest];
    const list=document.getElementById('noteList');
    if(!vis.length){list.innerHTML='<div class="empty">No notes. Hit + New to start.</div>';renderStats();updateTagFilter();return;}
    list.innerHTML=vis.map(n=>`
      <div class="note-item${n.id===activeId?' active':''}" onclick="openNote('${n.id}')" style="border-left:3px solid ${COLOR_DOTS[n.color||0]};">
        <div class="note-item-title">${n.pinned?'📌 ':''}${esc(n.title)||'Untitled'}</div>
        <div class="note-item-preview">${esc(n.body.slice(0,60))||'Empty note'}</div>
        <div class="note-item-meta">${timeAgo(n.modified||n.ts)} · ${wc(n.body)} words</div>
      </div>`).join('');
    renderStats();updateTagFilter();
  }

  function renderEditor(){
    const n=notes.find(x=>x.id===activeId);
    const panel=document.getElementById('editorPanel');
    if(!n){panel.innerHTML='<div style="text-align:center;color:#6b8fad;padding:40px;"><div style="font-size:2rem;margin-bottom:8px;">📝</div>Select a note or create one</div>';return;}
    panel.innerHTML=`
      <div class="row" style="justify-content:space-between;">
        <div class="color-dots" id="colorDots">
          ${COLOR_DOTS.map((c,i)=>`<div class="dot${(n.color||0)===i?' active':''}" style="background:${c};" title="${COLOR_LABELS[i]}" onclick="setColor('${n.id}',${i})"></div>`).join('')}
        </div>
        <div class="row">
          <button class="btn ghost sm" onclick="togglePin('${n.id}')">${n.pinned?'📌 Unpin':'📌 Pin'}</button>
          <button class="btn ghost sm" onclick="exportNote('${n.id}')">📤 Export</button>
          <button class="btn danger sm" onclick="deleteNote('${n.id}')">🗑</button>
        </div>
      </div>
      <input class="note-title-input" id="noteTitle" value="${esc(n.title)}" placeholder="Note title..." oninput="updateTitle('${n.id}',this.value)"/>
      <textarea class="editor" id="noteBody" placeholder="Start writing...">${esc(n.body)}</textarea>
      <div class="row" style="justify-content:space-between;">
        <div class="row">
          <input id="tagInput" placeholder="Add tag..." style="width:120px;padding:5px 8px;font-size:.8rem;"/>
          <button class="btn ghost sm" onclick="addTag('${n.id}')">+Tag</button>
        </div>
        <span class="wc" id="noteWc">${wc(n.body)} words</span>
      </div>
      <div class="tag-pills" id="tagList">
        ${(n.tags||[]).map(t=>`<span class="tag-pill" onclick="removeTag('${n.id}','${esc(t)}')">${esc(t)} ✕</span>`).join('')}
      </div>`;
    document.getElementById('noteBody').addEventListener('input',e=>{
      const note=notes.find(x=>x.id===activeId);
      if(!note)return;note.body=e.target.value;note.modified=Date.now();
      document.getElementById('noteWc').textContent=wc(note.body)+' words';
      save();render();
    });
  }

  window.openNote=id=>{activeId=id;render();renderEditor();};
  window.setColor=(id,c)=>{const n=notes.find(x=>x.id===id);if(!n)return;n.color=c;save();render();renderEditor();};
  window.togglePin=id=>{const n=notes.find(x=>x.id===id);if(!n)return;n.pinned=!n.pinned;save();render();renderEditor();};
  window.deleteNote=id=>{if(!confirm('Delete this note?'))return;notes=notes.filter(n=>n.id!==id);activeId=null;save();render();renderEditor();};
  window.updateTitle=(id,val)=>{const n=notes.find(x=>x.id===id);if(!n)return;n.title=val;n.modified=Date.now();save();render();};
  window.addTag=id=>{
    const n=notes.find(x=>x.id===id);const inp=document.getElementById('tagInput');
    if(!n||!inp)return;const t=inp.value.trim().toLowerCase();
    if(!t||n.tags.includes(t))return;n.tags.push(t);inp.value='';save();render();renderEditor();
  };
  window.removeTag=(id,t)=>{const n=notes.find(x=>x.id===id);if(!n)return;n.tags=n.tags.filter(x=>x!==t);save();render();renderEditor();};
  window.exportNote=id=>{
    const n=notes.find(x=>x.id===id);if(!n)return;
    const txt=`${n.title}\n${'='.repeat(n.title.length)}\n${n.body}\n\nTags: ${n.tags.join(', ')}`;
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));
    a.download=(n.title||'note').replace(/\s+/g,'-')+'.txt';a.click();
  };

  document.getElementById('newNoteBtn').addEventListener('click',newNote);
  document.getElementById('searchNotes').addEventListener('input',render);
  document.getElementById('filterTag').addEventListener('change',render);

  load();render();
})();
</script>
<script src="app-catalog.js"></script><script src="app-universe-shell.js" defer></script>
</body></html>
