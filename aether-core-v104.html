<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Krishiv PB">
    <title>AETHER-TITAN | v104.0 OMNI-SPEC</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00f2ff; --glow: rgba(0, 242, 255, 0.4);
            --bg: #020204; --sidebar: rgba(10, 10, 15, 0.8);
            --border: rgba(255, 255, 255, 0.08); --text: #f0f0f0;
            --purple: #7000ff;
        }

        * { box-sizing: border-box; cursor: crosshair; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text); 
            font-family: 'Plus Jakarta Sans', sans-serif; height: 100vh; display: flex; overflow: hidden;
        }

        /* DYNAMIC NEURAL BACKGROUND */
        #neural-mesh { position: fixed; inset: 0; z-index: 0; opacity: 0.25; pointer-events: none; }
        .gradient-orb {
            position: absolute; width: 700px; height: 700px;
            background: radial-gradient(circle, var(--glow) 0%, transparent 75%);
            filter: blur(120px); pointer-events: none; z-index: 0; animation: float 15s infinite alternate;
        }
        @keyframes float { from { transform: translate(-10%, -10%); } to { transform: translate(10%, 10%); } }

        /* SIDEBAR ARCHITECTURE */
        .sidebar {
            width: 350px; background: var(--sidebar); border-right: 1px solid var(--border);
            backdrop-filter: blur(30px); display: flex; flex-direction: column; padding: 40px 30px; z-index: 10;
        }

        .brand h1 { font-size: 10px; letter-spacing: 12px; color: var(--accent); text-transform: uppercase; margin: 0; font-weight: 800; }
        .brand p { font-size: 34px; font-weight: 800; margin: 8px 0; letter-spacing: -1.5px; background: linear-gradient(to bottom, #fff, #888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* V90 NEW CHAT BUTTON (CHAMPION STYLE) */
        .btn-new {
            width: 100%; padding: 16px; margin: 25px 0;
            background: linear-gradient(90deg, rgba(0,242,255,0.1), transparent);
            border: 1px solid var(--border); border-left: 3px solid var(--accent);
            color: #fff; border-radius: 8px; font-weight: 700; font-size: 11px;
            text-transform: uppercase; cursor: pointer; transition: 0.4s;
            display: flex; align-items: center; gap: 12px; letter-spacing: 1px;
        }
        .btn-new:hover { background: var(--accent); color: #000; transform: translateX(5px); box-shadow: 0 0 30px var(--glow); }

        /* TELEMETRY ENGINE */
        .telemetry-card { 
            background: rgba(255,255,255,0.03); border: 1px solid var(--border); 
            border-radius: 16px; padding: 20px; margin-bottom: 30px;
        }
        .stat { display: flex; justify-content: space-between; font-family: 'JetBrains Mono'; font-size: 10px; margin-bottom: 8px; color: #666; }
        .stat b { color: var(--accent); }
        
        .node-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 15px; }
        .node { height: 6px; background: #1a1a1a; border-radius: 10px; transition: 0.3s; }
        .node.active { background: var(--accent); box-shadow: 0 0 12px var(--accent); }

        /* CHAT INTERFACE */
        .main-stage { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 10; }
        #chatWall { flex: 1; overflow-y: auto; padding: 60px 12% 20px; mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent); }
        
        .msg-wrapper { margin-bottom: 40px; animation: emerge 0.7s cubic-bezier(0.075, 0.82, 0.165, 1); }
        @keyframes emerge { from { opacity: 0; transform: translateY(30px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        
        .msg-bubble { 
            max-width: 88%; padding: 28px; border-radius: 28px; font-size: 16px; line-height: 1.8;
            background: rgba(255, 255, 255, 0.015); border: 1px solid var(--border); backdrop-filter: blur(10px);
        }
        .user .msg-bubble { margin-left: auto; border-bottom-right-radius: 4px; border-top: 1px solid rgba(112, 0, 255, 0.3); }
        .bot .msg-bubble { margin-right: auto; border-bottom-left-radius: 4px; border-top: 1px solid rgba(0, 242, 255, 0.3); }

        /* OMNI INPUT DOCK */
        .input-container { padding: 40px 12%; }
        .input-glass { 
            background: rgba(20, 20, 25, 0.8); border: 1px solid var(--border);
            padding: 10px 10px 10px 30px; border-radius: 100px; display: flex; align-items: center;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8); position: relative;
        }
        #userInput { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 16px; font-family: 'Plus Jakarta Sans'; }
        
        .send-btn { 
            background: var(--accent); color: #000; border: none; width: 50px; height: 50px; 
            border-radius: 50%; font-weight: 900; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        .send-btn:hover { transform: scale(1.1) rotate(-10deg); box-shadow: 0 0 25px var(--accent); }

        .file-pill {
            position: absolute; top: -45px; left: 50%; transform: translateX(-50%);
            background: var(--accent); color: #000; padding: 6px 16px; border-radius: 100px;
            font-size: 10px; font-weight: 800; font-family: 'JetBrains Mono'; display: none;
        }
        .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
        .quick-btn {
            border: 1px solid var(--border);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            color: #cde8ee;
            font: 700 10px/1.2 "JetBrains Mono", monospace;
            letter-spacing: 0.04em;
            padding: 10px 8px;
            cursor: pointer;
        }
        .quick-btn:hover { border-color: var(--accent); color: #fff; }
        .mini-badge-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
        .mini-badge {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 4px;
            text-align: center;
            background: rgba(255, 255, 255, 0.02);
            font: 700 9px/1.2 "JetBrains Mono", monospace;
            color: #9bd5df;
        }
        .mini-badge svg { display: block; margin: 0 auto 6px; width: 16px; height: 16px; stroke: var(--accent); fill: none; stroke-width: 1.8; }
    </style>
    <link rel="stylesheet" href="app-universe-shell.css" />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@400;500;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet" />
  <style id="codex-shared-fonts">
    body, button, input, select, textarea {
      font-family: "Space Grotesk", "Segoe UI", sans-serif !important;
    }

    h1, h2, h3, h4, h5, h6, .brand, .site-title, .logo-text {
      font-family: "Orbitron", "Space Grotesk", sans-serif !important;
    }

    code, pre, .mono, .eyebrow, .card-kicker, .mini-label {
      font-family: "JetBrains Mono", monospace !important;
    }
  </style>
</head>
<body>

<canvas id="neural-mesh"></canvas>
<div class="gradient-orb"></div>

<aside class="sidebar">
    <div class="brand">
        <h1>AETHER CORE</h1>
        <p>TITAN v104</p>
    </div>

    <button class="btn-new" onclick="resetSystem()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        Re-Initialize Synapse
    </button>

    <div class="telemetry-card">
        <div class="stat"><span>SYNAPSE_LOAD</span><b id="loadStat">0.00%</b></div>
        <div class="stat"><span>ENGINE_STATUS</span><b>OPTIMAL</b></div>
        <div class="node-grid" id="nodeMap"></div>
    </div>

    <div class="quick-grid">
        <button class="quick-btn" onclick="injectPrompt('Build a launch plan for my next web app in 5 steps.')">PLAN</button>
        <button class="quick-btn" onclick="injectPrompt('Review my code strategy and list top improvements.')">REVIEW</button>
        <button class="quick-btn" onclick="exportTranscript()">EXPORT</button>
        <button class="quick-btn" onclick="copyLastResponse()">COPY</button>
    </div>

    <div class="mini-badge-row">
        <div class="mini-badge"><svg viewBox="0 0 24 24"><path d="M12 3l7 4v10l-7 4-7-4V7l7-4z"/></svg>NEX</div>
        <div class="mini-badge"><svg viewBox="0 0 24 24"><path d="M4 18L12 4l8 14M7 14h10"/></svg>ARC</div>
        <div class="mini-badge"><svg viewBox="0 0 24 24"><path d="M4 12h16M12 4v16"/></svg>SYNC</div>
        <div class="mini-badge"><svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg>CORE</div>
    </div>

    <div style="flex: 1; overflow-y: auto;">
        <div style="font-size: 9px; letter-spacing: 2px; color: #444; margin-bottom: 15px; text-transform: uppercase;">Synaptic Logs</div>
        <div id="historyFeed"></div>
    </div>

    <div style="margin-top: 30px;">
        <button onclick="document.getElementById('fileLoad').click()" style="width:100%; padding:14px; background:transparent; border:1px solid #222; color:#555; border-radius:10px; font-size:10px; font-weight:700; cursor:pointer;">INJECT_ASSET_STREAM</button>
        <input type="file" id="fileLoad" hidden onchange="processFile(this)">
    </div>
</aside>

<main class="main-stage">
    <div id="chatWall">
        <div id="hero" style="height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0.03;">
            <svg width="180" height="180" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="0.3"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            <h1 style="letter-spacing: 30px; margin-top: 40px; font-weight: 300;">TITAN</h1>
        </div>
    </div>

    <div class="input-container">
        <div class="input-glass">
            <div id="fileStatus" class="file-pill">ASSET_SYNCHRONIZED</div>
            <input type="text" id="userInput" placeholder="Formulate neural command..." onkeypress="if(event.key==='Enter') execute()">
            <button class="send-btn" onclick="execute()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            </button>
        </div>
    </div>
</main>

<script>
    const VIRTUAL_NODE_COUNT = 10;

    let buffer = "";
    let lastBotResponse = "";
    let logs = JSON.parse(localStorage.getItem('titan_ultimate_logs') || '[]');
    let historyIndex = -1;

    // Build Nodes
    Array.from({ length: VIRTUAL_NODE_COUNT }).forEach((_, i) => {
        const n = document.createElement('div');
        n.className = 'node'; n.id = `n-${i}`;
        document.getElementById('nodeMap').appendChild(n);
    });

    function resetSystem() {
        document.getElementById('chatWall').innerHTML = `<div id="hero" style="height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0.03;"><svg width="180" height="180" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="0.3"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg><h1 style="letter-spacing: 30px; margin-top: 40px; font-weight: 300;">TITAN</h1></div>`;
        buffer = "";
        document.getElementById('fileStatus').style.display = 'none';
        document.getElementById('loadStat').innerText = "0.00%";
        document.querySelectorAll('.node').forEach(n => n.classList.remove('active'));
    }

    function refreshLogs() {
        const f = document.getElementById('historyFeed');
        f.innerHTML = logs.slice(0, 8).map(l => `<div style="padding:12px; border-bottom:1px solid #111; font-size:12px; color:#555; cursor:pointer;" onclick="document.getElementById('userInput').value='${l}'">${l}</div>`).join('');
    }
    refreshLogs();

    function recallHistory(step) {
        const input = document.getElementById('userInput');
        if (!logs.length || !input) return;
        if (historyIndex < 0) historyIndex = 0;
        else historyIndex = Math.min(logs.length - 1, Math.max(0, historyIndex + step));
        input.value = logs[historyIndex] || "";
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
    }

    document.getElementById('userInput').addEventListener('keydown', (event) => {
        if (event.key === 'ArrowUp') {
            event.preventDefault();
            recallHistory(1);
            return;
        }
        if (event.key === 'ArrowDown') {
            event.preventDefault();
            if (historyIndex <= 0) {
                historyIndex = -1;
                event.currentTarget.value = "";
                return;
            }
            recallHistory(-1);
            return;
        }
        if (event.key === 'Tab' && !event.shiftKey) {
            event.preventDefault();
            recallHistory(historyIndex < 0 ? 0 : 1);
            return;
        }
        historyIndex = -1;
    });

    async function processFile(input) {
        const f = input.files[0];
        const ps = document.getElementById('fileStatus');
        ps.style.display = 'block'; ps.innerText = `SCRAPING: ${f.name.toUpperCase()}`;
        
        if (f.name.endsWith('.pptx')) {
            const zip = await JSZip.loadAsync(f);
            let text = "";
            const slides = Object.keys(zip.files).filter(x => x.startsWith("ppt/slides/slide") && x.endsWith(".xml"));
            for (let s of slides) {
                const xml = await zip.file(s).async("text");
                const nodes = new DOMParser().parseFromString(xml, "text/xml").getElementsByTagName("a:t");
                for (let n of nodes) text += n.textContent + " ";
            }
            buffer = text;
        } else { buffer = await f.text(); }
        ps.innerText = `READY: ${f.name.toUpperCase()}`;
    }

    async function execute() {
        const ui = document.getElementById('userInput');
        const cmd = ui.value.trim();
        if(!cmd && !buffer) return;

        if(document.getElementById('hero')) document.getElementById('chatWall').innerHTML = '';
        if(cmd) {
            logs.unshift(cmd);
            logs = Array.from(new Set(logs)).slice(0, 30);
            localStorage.setItem('titan_ultimate_logs', JSON.stringify(logs));
            refreshLogs();
        }

        render('user', cmd || "Binary Stream Analysis Requested");
        ui.value = '';
        const loader = render('bot', '<span style="opacity:0.2">NEURAL_DECRYPTION_ACTIVE...</span>');
        
        await route(0, buffer ? `[CONTEXT: ${buffer}] ${cmd}` : cmd, loader);
        buffer = ""; document.getElementById('fileStatus').style.display = 'none';
    }

    function injectPrompt(text) {
        const input = document.getElementById('userInput');
        input.value = text;
        input.focus();
    }

    function exportTranscript() {
        const text = document.getElementById('chatWall').innerText.trim();
        if (!text) return;
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const href = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = href;
        link.download = `aether-v104-transcript-${Date.now()}.txt`;
        link.click();
        URL.revokeObjectURL(href);
    }

    async function copyLastResponse() {
        if (!lastBotResponse) return;
        try {
            await navigator.clipboard.writeText(lastBotResponse);
            document.getElementById('loadStat').innerText = "COPIED";
        } catch {}
    }

    async function route(idx, prompt, loader) {
        if(idx >= VIRTUAL_NODE_COUNT) { loader.innerHTML = "FATAL: CORE_LINK_LOSS"; return; }
        
        document.querySelectorAll('.node').forEach(n => n.classList.remove('active'));
        document.getElementById(`n-${idx}`).classList.add('active');
        document.getElementById('loadStat').innerText = `${(Math.random()*90 + 10).toFixed(2)}%`;

        try {
            const res = await fetch("/api/aether/chat", {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({
                    prompt,
                    systemPrompt: "You are AETHER TITAN v104. Give structured, technical, high-signal responses with concise sections."
                })
            });
            const d = await res.json();
            if(!res.ok) throw new Error(d.error || "BACKEND_FAILURE");
            lastBotResponse = String(d.text || "");
            loader.innerHTML = marked.parse(d.text || "No response.");
            document.getElementById('loadStat').innerText = "0.01%";
        } catch(e) {
            document.getElementById(`n-${idx}`).style.background = "#ff0055";
            await route(idx + 1, prompt, loader);
        }
    }

    function render(role, text) {
        const wall = document.getElementById('chatWall');
        const wrap = document.createElement('div');
        wrap.className = `msg-wrapper ${role}`;
        wrap.innerHTML = `<div class="msg-bubble">${text}</div>`;
        wall.appendChild(wrap);
        wall.scrollTop = wall.scrollHeight;
        return wrap.querySelector('.msg-bubble');
    }

    const c = document.getElementById('neural-mesh');
    const ctx = c.getContext('2d');
    c.width = window.innerWidth; c.height = window.innerHeight;
    let dots = [];
    for(let i=0; i<40; i++) dots.push({x:Math.random()*c.width, y:Math.random()*c.height, vx:(Math.random()-0.5)*0.4, vy:(Math.random()-0.5)*0.4});
    function anim() {
        ctx.clearRect(0,0,c.width,c.height);
        ctx.strokeStyle = "rgba(0, 242, 255, 0.1)"; ctx.lineWidth = 0.5;
        dots.forEach(d => {
            d.x += d.vx; d.y += d.vy;
            if(d.x<0||d.x>c.width) d.vx*=-1; if(d.y<0||d.y>c.height) d.vy*=-1;
            dots.forEach(d2 => {
                if(Math.hypot(d.x-d2.x, d.y-d2.y) < 180) { ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d2.x, d2.y); ctx.stroke(); }
            });
        });
        requestAnimationFrame(anim);
    }
    anim();
</script>
<script src="app-universe-shell.js" defer></script>
</body>
</html>
