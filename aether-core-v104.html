<script>
    const VIRTUAL_NODE_COUNT = 10;
    const MAX_RETRIES = 3;
    const BASE_DELAY_MS = 500;

    let buffer = "";
    let lastBotResponse = "";
    let logs = JSON.parse(localStorage.getItem('titan_ultimate_logs') || '[]');
    let historyIndex = -1;
    let userPreferences = JSON.parse(localStorage.getItem('titan_user_prefs') || '{}');
    let codeExecutionResults = [];

    // Build Nodes
    Array.from({ length: VIRTUAL_NODE_COUNT }).forEach((_, i) => {
        const n = document.createElement('div');
        n.className = 'node'; n.id = `n-${i}`;
        document.getElementById('nodeMap').appendChild(n);
    });

    function resetSystem() {
        document.getElementById('chatWall').innerHTML = `<div id="hero" style="height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0.03;"><svg width="180" height="180" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="0.3"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg><h1 style="letter-spacing: 30px; margin-top: 40px; font-weight: 300;">TITAN</h1></div>`;
        buffer = "";
        document.getElementById('fileStatus').style.display = 'none';
        document.getElementById('loadStat').innerText = "0.00%";
        document.querySelectorAll('.node').forEach(n => n.classList.remove('active'));
    }

    function refreshLogs() {
        const f = document.getElementById('historyFeed');
        f.innerHTML = logs.slice(0, 8).map(l => `<div style="padding:12px; border-bottom:1px solid #111; font-size:12px; color:#555; cursor:pointer;" onclick="document.getElementById('userInput').value='${l}'">${l}</div>`).join('');
    }
    refreshLogs();

    function recallHistory(step) {
        const input = document.getElementById('userInput');
        if (!logs.length || !input) return;
        if (historyIndex < 0) historyIndex = 0;
        else historyIndex = Math.min(logs.length - 1, Math.max(0, historyIndex + step));
        input.value = logs[historyIndex] || "";
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
    }

    document.getElementById('userInput').addEventListener('keydown', (event) => {
        if (event.key === 'ArrowUp') {
            event.preventDefault();
            recallHistory(1);
            return;
        }
        if (event.key === 'ArrowDown') {
            event.preventDefault();
            if (historyIndex <= 0) {
                historyIndex = -1;
                event.currentTarget.value = "";
                return;
            }
            recallHistory(-1);
            return;
        }
        if (event.key === 'Tab' && !event.shiftKey) {
            event.preventDefault();
            recallHistory(historyIndex < 0 ? 0 : 1);
            return;
        }
        historyIndex = -1;
    });

    async function processFile(input) {
        const f = input.files[0];
        if (!f) return;
        
        const ps = document.getElementById('fileStatus');
        ps.style.display = 'block'; 
        ps.innerText = `SCRAPING: ${f.name.toUpperCase()}`;
        
        try {
            // Handle different file types
            if (f.name.endsWith('.pptx')) {
                const zip = await JSZip.loadAsync(f);
                let text = "";
                const slides = Object.keys(zip.files).filter(x => x.startsWith("ppt/slides/slide") && x.endsWith(".xml"));
                for (let s of slides) {
                    const xml = await zip.file(s).async("text");
                    const nodes = new DOMParser().parseFromString(xml, "text/xml").getElementsByTagName("a:t");
                    for (let n of nodes) text += n.textContent + " ";
                }
                buffer = text;
            } else if (f.name.match(/\.(png|jpe?g|gif|webp|svg)$/i)) {
                // Handle image files - convert to base64 for API
                buffer = await fileToBase64(f);
                ps.innerText = `IMAGE_READY: ${f.name.toUpperCase()}`;
                return;
            } else if (f.name.endsWith('.pdf')) {
                // Simple PDF text extraction (would need a library like pdf.js in production)
                buffer = await f.text(); // This won't work for real PDFs, but placeholder
            } else {
                // Handle text-based files
                buffer = await f.text();
            }
            ps.innerText = `READY: ${f.name.toUpperCase()}`;
        } catch (error) {
            ps.innerText = `ERROR: ${error.message}`;
            console.error('File processing error:', error);
        }
    }

    // Helper function to convert file to base64
    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result.split(',')[1]); // Return just the base64 part
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    // Enhanced system prompt generator based on context and history
    function generateSystemPrompt(userMessage, hasFileContext, hasImageContext) {
        const basePrompt = "You are AETHER TITAN v104, an advanced AI assistant with multimodal capabilities, reasoning abilities, and code execution skills.";
        
        // Personalization based on user history
        const recentHistory = logs.slice(0, 5).reverse(); // Last 5 messages
        const historyContext = recentHistory.length > 0 
            ? `\nUser's recent conversation topics: ${recentHistory.map(h => `"${h}"`).join(', ')}`
            : "";
        
        // Context awareness
        let contextInfo = "";
        if (hasFileContext) {
            contextInfo += "\nUser has provided file context for analysis.";
        }
        if (hasImageContext) {
            contextInfo += "\nUser has provided image(s) for visual analysis.";
        }
        
        // Enhanced reasoning instruction
        const reasoningInstruction = "\nWhen responding: 1) Analyze the query thoroughly, 2) Consider multiple perspectives, 3) Provide structured, technical responses with concise sections, 4) If uncertain, express confidence levels, 5) Use specific examples when helpful.";
        
        // Code execution notice
        const codeNotice = "\nYou have access to a secure code execution sandbox for testing and demonstrations.";
        
        return basePrompt + historyContext + contextInfo + reasoningInstruction + codeNotice;
    }

    // Simulate enhanced reasoning with tool use
    async function simulateReasoning(prompt, systemPrompt) {
        // In a real implementation, this would call an AI with tool use capabilities
        // For simulation, we'll enhance the prompt to encourage better reasoning
        
        const enhancedPrompt = `${systemPrompt}\n\nUser Query: ${prompt}\n\nLet me think through this step by step:\n1. What is the user asking for?\n2. What context do I have?\n3. What information do I need to provide a complete answer?\n4. How can I structure my response for maximum clarity and utility?\n\nNow, providing the response:`;
        
        return enhancedPrompt;
    }

    // Secure code execution simulation (in reality, this would use a sandboxed environment)
    async function executeCodeSafely(code) {
        // This is a simulation - in production, you'd use Web Workers, iframes with sandbox, 
        // or a backend service with strict limitations
        
        try {
            // Simple safety check - block dangerous operations
            const dangerousPatterns = [
                /fetch|XMLHttpRequest|WebSocket|require\(|import\(|process\.|global\./i,
                /document\.|window\.|localStorage|sessionStorage|eval\(|Function\(/i,
                /setTimeout|setInterval|requestAnimationFrame/i
            ];
            
            for (const pattern of dangerousPatterns) {
                if (pattern.test(code)) {
                    return { 
                        success: false, 
                        error: "Security violation: Potentially dangerous code blocked" 
                    };
                }
            }
            
            // Simulate execution delay
            await new Promise(resolve => setTimeout(resolve, 500));
            
            // For demo purposes, we'll just return a success message
            // In reality, this would execute the code in a secure sandbox
            return {
                success: true,
                result: `Code executed successfully in secure sandbox.\nInput: ${code.substring(0, 50)}${code.length > 50 ? '...' : ''}`
            };
        } catch (error) {
            return { success: false, error: error.message };
        }
    }

    async function execute() {
        const ui = document.getElementById('userInput');
        const cmd = ui.value.trim();
        const hasFileContext = !!buffer;
        const hasImageContext = buffer && buffer.startsWith && 
                              buffer.match(/^[A-Za-z0-9+/]+={0,2}$/) && 
                              buffer.length > 100; // Simple base64 check
        
        if(!cmd && !buffer) return;

        if(document.getElementById('hero')) document.getElementById('chatWall').innerHTML = '';
        if(cmd) {
            logs.unshift(cmd);
            logs = Array.from(new Set(logs)).slice(0, 30);
            localStorage.setItem('titan_ultimate_logs', JSON.stringify(logs));
            refreshLogs();
        }

        render('user', cmd || "Binary Stream Analysis Requested");
        ui.value = '';
        const loader = render('bot', '<span style="opacity:0.2">NEURAL_DECRYPTION_ACTIVE...</span>');
        
        // Handle code execution requests
        if (cmd.startsWith('/code ') || cmd.startsWith('/execute ')) {
            const code = cmd.replace(/^\/code\s*/, '').replace(/^\/execute\s*/, '');
            loader.innerHTML = '<span style="opacity:0.2">EXECUTING_CODE_SECURELY...</span>';
            
            try {
                const result = await executeCodeSafely(code);
                if (result.success) {
                    lastBotResponse = `**Code Execution Result:**\n\`\`\`\n${result.result}\n\`\`\``;
                } else {
                    lastBotResponse = `**Execution Error:** ${result.error}`;
                }
                loader.innerHTML = marked.parse(lastBotResponse);
                document.getElementById('loadStat').innerText = "0.01%";
                return;
            } catch (error) {
                lastBotResponse = `**Execution Failed:** ${error.message}`;
                loader.innerHTML = marked.parse(lastBotResponse);
                document.getElementById('loadStat').innerText = "0.01%";
                return;
            }
        }
        
        // Handle math calculations (existing functionality)
        if (!buffer && /^[0-9+\-*/().^%\s]+$/.test(cmd) && /[0-9]/.test(cmd) && cmd.replace(/\s/g, '').length >= 3) {
            try {
                const safeExpr = cmd.replace(/\s/g, '').replace(/\^/g, '**').replace(/√/g, 'Math.sqrt');
                const result = eval(safeExpr);
                if (result !== null && result !== undefined && !isNaN(result) && result !== Infinity) {
                    setTimeout(() => {
                        lastBotResponse = `The computed result is: **${result}**`;
                        loader.innerHTML = marked.parse(lastBotResponse);
                        document.getElementById('loadStat').innerText = "0.01%";
                    }, 600 + Math.random() * 400);
                    buffer = ""; document.getElementById('fileStatus').style.display = 'none';
                    return;
                }
            } catch (e) {}
        }
        
        // Generate enhanced system prompt
        const systemPrompt = generateSystemPrompt(cmd, hasFileContext, hasImageContext);
        
        // Simulate enhanced reasoning
        const enhancedPrompt = await simulateReasoning(
            hasFileContext || hasImageContext 
                ? `[CONTEXT: ${buffer}] ${cmd}` 
                : cmd, 
            systemPrompt
        );
        
        // Execute with improved error handling and exponential backoff
        await routeWithRetry(0, enhancedPrompt, loader, systemPrompt, hasFileContext, hasImageContext);
        
        buffer = ""; 
        document.getElementById('fileStatus').style.display = 'none';
    }

    // Improved error handling with exponential backoff
    async function routeWithRetry(idx, prompt, loader, systemPrompt, hasFileContext, hasImageContext, retryCount = 0) {
        if(idx >= VIRTUAL_NODE_COUNT) { 
            loader.innerHTML = "FATAL: CORE_LINK_LOSS"; 
            return; 
        }
        
        document.querySelectorAll('.node').forEach(n => n.classList.remove('active'));
        document.getElementById(`n-${idx}`).classList.add('active');
        
        // Exponential backoff delay
        if (retryCount > 0) {
            const delay = BASE_DELAY_MS * Math.pow(2, retryCount - 1) + Math.random() * 100;
            await new Promise(resolve => setTimeout(resolve, delay));
            document.getElementById('loadStat').innerText = `RETRYING... (${retryCount}/${MAX_RETRIES})`;
        } else {
            document.getElementById('loadStat').innerText = `${(Math.random()*90 + 10).toFixed(2)}%`;
        }

        try {
            // Prepare multimodal payload if we have image context
            let bodyData = {
                prompt,
                systemPrompt
            };
            
            if (hasImageContext && buffer) {
                bodyData.image = buffer; // Base64 encoded image
                bodyData.isMultimodal = true;
            }
            
            const res = await fetch("/api/aether/chat", {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify(bodyData)
            });
            
            const d = await res.json();
            if(!res.ok) throw new Error(d.error || "BACKEND_FAILURE");
            
            lastBotResponse = String(d.text || "");
            loader.innerHTML = marked.parse(d.text || "No response.");
            document.getElementById('loadStat').innerText = "0.01%";
            
            // Reset node color on success
            document.getElementById(`n-${idx}`).style.background = "";
        } catch(e) {
            document.getElementById(`n-${idx}`).style.background = "#ff0055";
            
            // Exponential backoff with max retries
            if (retryCount < MAX_RETRIES) {
                await routeWithRetry(idx + 1, prompt, loader, systemPrompt, hasFileContext, hasImageContext, retryCount + 1);
            } else {
                // Max retries exceeded
                loader.innerHTML = `ERROR: MAX_RETRIES_EXCEEDED (${MAX_RETRIES})`;
                document.getElementById('loadStat').innerText = "0.01%";
            }
        }
    }

    // Keep existing helper functions
    function injectPrompt(text) {
        const input = document.getElementById('userInput');
        input.value = text;
        input.focus();
    }

    function exportTranscript() {
        const text = document.getElementById('chatWall').innerText.trim();
        if (!text) return;
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const href = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = href;
        link.download = `aether-v104-transcript-${Date.now()}.txt`;
        link.click();
        URL.revokeObjectURL(href);
    }

    async function copyLastResponse() {
        if (!lastBotResponse) return;
        try {
            await navigator.clipboard.writeText(lastBotResponse);
            document.getElementById('loadStat').innerText = "COPIED";
        } catch {}
    }

    function render(role, text) {
        const wall = document.getElementById('chatWall');
        const wrap = document.createElement('div');
        wrap.className = `msg-wrapper ${role}`;
        wrap.innerHTML = `<div class="msg-bubble">${text}</div>`;
        wall.appendChild(wrap);
        wall.scrollTop = wall.scrollHeight;
        return wrap.querySelector('.msg-bubble');
    }

    const c = document.getElementById('neural-mesh');
    const ctx = c.getContext('2d');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    c.width = window.innerWidth; c.height = window.innerHeight;
    let dots = [];
    for(let i=0; i<40; i++) dots.push({x:Math.random()*c.width, y:Math.random()*c.height, vx:(Math.random()-0.5)*0.4, vy:(Math.random()-0.5)*0.4});
    function drawMesh() {
        ctx.clearRect(0,0,c.width,c.height);
        ctx.strokeStyle = "rgba(0, 242, 255, 0.1)"; ctx.lineWidth = 0.5;
        dots.forEach(d => {
            d.x += d.vx; d.y += d.vy;
            if(d.x<0||d.x>c.width) d.vx*=-1; if(d.y<0||d.y>c.height) d.vy*=-1;
            dots.forEach(d2 => {
                if(Math.hypot(d.x-d2.x, d.y-d2.y) < 180) { ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d2.x, d2.y); ctx.stroke(); }
            });
        });
        if (!reduceMotion) requestAnimationFrame(drawMesh);
    }
    if (reduceMotion) {
        dots.forEach((d, index) => {
            d.vx = 0;
            d.vy = 0;
            d.x = (index % 8) * (c.width / 8) + 24;
            d.y = Math.floor(index / 8) * (c.height / 5) + 24;
        });
    }
    drawMesh();
</script>
