<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Krishiv PB" />
  <title>Goal Planner | Krishiv PB</title>
  <style>
    :root{--bg:#061223;--panel:#0f243d;--line:#34597e;--text:#eef7ff;--muted:#a7c4e4;--accent:#79d8ff;--ok:#57d9ab}
    *{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--text);background:linear-gradient(165deg,#040d18,#0a2139 50%,#15365d)}
    .wrap{width:min(940px,94%);margin:24px auto 86px}.card{border:1px solid var(--line);border-radius:16px;padding:16px;background:linear-gradient(160deg,rgba(17,38,63,.95),rgba(8,20,38,.95));margin-bottom:12px}
    h1,h2{margin:0 0 8px}p{margin:0 0 10px;color:var(--muted)}.row{display:grid;gap:10px;grid-template-columns:1fr 200px 140px}
    input,select,button{width:100%;border-radius:10px;border:1px solid var(--line);background:#08192d;color:var(--text);padding:10px;font:inherit}
    .btn-primary{font-weight:700;border:none;background:linear-gradient(135deg,var(--accent),var(--ok));color:#042132}
    .goal{border:1px solid rgba(111,164,216,.25);border-radius:12px;padding:10px;background:rgba(6,18,32,.7);margin-bottom:8px}.goal.done{border-color:rgba(87,217,171,.6)}
    .meta{font-size:.86rem;color:#9ebfe0}.credit{font-weight:700;color:#d9ecff}a{color:#9fd9ff}
    @media(max-width:780px){.row{grid-template-columns:1fr}}
  </style>
  <link rel="stylesheet" href="app-universe-shell.css" />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
</head>
<body data-theme="default" data-mode="dark">
  <main class="wrap">
    <section class="card"><h1>Goal Planner</h1><p>Set weekly and monthly goals with clear status tracking.</p><p class="credit">Created by Krishiv PB</p><p><a href="index.html#app-verse">Back to Apps Galaxy</a></p></section>
    <section class="card">
      <h2>Add Goal</h2>
      <div class="row"><input id="goalText" maxlength="100" placeholder="Goal (Upload 2 videos this week)" /><select id="goalType"><option>Weekly</option><option>Monthly</option><option>Project</option></select><button id="addGoal" class="btn-primary" type="button">Add Goal</button></div>
      <p>Details: break big ambitions into trackable goals to build momentum.</p>
    </section>
    <section class="card"><h2>Goals Board</h2><div id="goalList"></div></section>
  </main>
  <script>
    (() => {
      const key="krishiv_goal_planner_v1", input=document.getElementById("goalText"), type=document.getElementById("goalType"), add=document.getElementById("addGoal"), list=document.getElementById("goalList");
      let goals=[]; try{goals=JSON.parse(localStorage.getItem(key)||"[]"); if(!Array.isArray(goals)) goals=[];}catch{goals=[];}
      const save=()=>localStorage.setItem(key,JSON.stringify(goals));
      const render=()=>{list.innerHTML=goals.length?goals.map(g=>`<article class="goal ${g.done?'done':''}"><strong>${g.text}</strong><div class="meta">${g.type} | ${new Date(g.ts).toLocaleDateString()}</div><button data-a="toggle" data-id="${g.id}">${g.done?'Mark Open':'Mark Done'}</button> <button data-a="delete" data-id="${g.id}">Delete</button></article>`).join(""):'<p class="meta">No goals yet.</p>';};
      add.addEventListener("click",()=>{const t=input.value.trim(); if(t.length<3){alert("Goal must be at least 3 characters.");return;} goals.unshift({id:Date.now().toString(36),text:t,type:type.value,done:false,ts:Date.now()}); input.value=""; save(); render();});
      list.addEventListener("click",(e)=>{const b=e.target; if(!(b instanceof HTMLButtonElement)) return; const id=b.dataset.id; if(!id) return; if(b.dataset.a==="toggle"){goals=goals.map(g=>g.id===id?({...g,done:!g.done}):g);} if(b.dataset.a==="delete"){goals=goals.filter(g=>g.id!==id);} save(); render();});
      render();
    })();
  </script>
  <script src="app-universe-shell.js" defer></script>
</body>
</html>
