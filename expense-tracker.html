<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Krishiv PB" />
  <title>Expense Tracker | Krishiv PB</title>
  <style>
    :root { --bg:#081323; --panel:#112844; --line:#355a84; --text:#eff7ff; --muted:#a8c5e7; --ok:#56d5a6; --bad:#ff7d7d; --acc:#7bd7ff; }
    * { box-sizing: border-box; } body { margin:0; font-family:Segoe UI,Arial,sans-serif; background:linear-gradient(160deg,#030a14,#0a223a 48%,#13375c); color:var(--text); }
    .wrap{width:min(980px,94%);margin:24px auto;} .card{border:1px solid var(--line);border-radius:14px;padding:14px;background:linear-gradient(160deg,rgba(17,40,68,.96),rgba(9,24,43,.96));margin-bottom:12px;}
    input,select,button{padding:10px;border-radius:10px;border:1px solid var(--line);background:#0a1a30;color:var(--text);font:inherit;} .row{display:flex;gap:8px;flex-wrap:wrap;}
    .btn{cursor:pointer;font-weight:700;} .btn.primary{border:none;background:linear-gradient(135deg,var(--acc),var(--ok));color:#042232;}
    table{width:100%;border-collapse:collapse;} th,td{padding:8px;border-bottom:1px solid rgba(84,126,171,.35);text-align:left;} .income{color:var(--ok);} .expense{color:var(--bad);}
    .meta{color:var(--muted);} a{color:#9ddcff;}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(90px,1fr));gap:8px;}
    .stat{border:1px solid rgba(84,126,171,.45);border-radius:10px;padding:10px;background:rgba(5,16,30,.68);}
    .stat strong{display:block;font-size:1.1rem;}
    @media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(90px,1fr));}}
  </style>

  <link rel="stylesheet" href="app-universe-shell.css" />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@400;500;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet" />
  <style id="codex-shared-fonts">
    body, button, input, select, textarea {
      font-family: "Space Grotesk", "Segoe UI", sans-serif !important;
    }

    h1, h2, h3, h4, h5, h6, .brand, .site-title, .logo-text {
      font-family: "Orbitron", "Space Grotesk", sans-serif !important;
    }

    code, pre, .mono, .eyebrow, .card-kicker, .mini-label {
      font-family: "JetBrains Mono", monospace !important;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Expense Tracker</h1>
      <p class="meta">Created by Krishiv PB</p>
      <a href="index.html#projects">Back to portfolio</a>
    </section>

    <section class="card">
      <div class="row">
        <input id="title" placeholder="Entry title" maxlength="60" />
        <input id="amount" type="number" step="0.01" placeholder="Amount" />
        <select id="type"><option value="expense">Expense</option><option value="income">Income</option></select>
        <select id="category">
          <option>General</option><option>Food</option><option>Study</option><option>Travel</option><option>Entertainment</option><option>Savings</option>
        </select>
        <input id="entryDate" type="date" />
        <button class="btn primary" id="addBtn">Add</button>
      </div>
    </section>

    <section class="card">
      <div class="stats">
        <article class="stat"><strong id="bal">0.00</strong><span class="meta">Balance</span></article>
        <article class="stat"><strong id="inc">0.00</strong><span class="meta">Income</span></article>
        <article class="stat"><strong id="exp">0.00</strong><span class="meta">Expense</span></article>
        <article class="stat"><strong id="monthSpend">0.00</strong><span class="meta">This Month Spend</span></article>
      </div>
      <div class="row" style="margin-top:10px;">
        <input id="search" placeholder="Search title/category..." />
        <select id="filterType"><option value="all">All Types</option><option value="income">Income</option><option value="expense">Expense</option></select>
        <button id="exportBtn" class="btn">Export CSV</button>
      </div>
    </section>

    <section class="card">
      <table>
        <thead><tr><th>Title</th><th>Category</th><th>Type</th><th>Date</th><th>Amount</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </main>
  <script>
    (() => {
      const key = "krishiv_pb_expense_tracker_v2";
      const title = document.getElementById("title");
      const amount = document.getElementById("amount");
      const type = document.getElementById("type");
      const category = document.getElementById("category");
      const entryDate = document.getElementById("entryDate");
      const addBtn = document.getElementById("addBtn");
      const search = document.getElementById("search");
      const filterType = document.getElementById("filterType");
      const exportBtn = document.getElementById("exportBtn");
      const rows = document.getElementById("rows");
      const bal = document.getElementById("bal");
      const inc = document.getElementById("inc");
      const exp = document.getElementById("exp");
      const monthSpend = document.getElementById("monthSpend");
      let items = [];

      entryDate.value = new Date().toISOString().slice(0, 10);

      function load(){ try{ items=JSON.parse(localStorage.getItem(key)||"[]"); if(!Array.isArray(items)) items=[]; }catch{ items=[]; } }
      function save(){ localStorage.setItem(key, JSON.stringify(items)); }
      function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

      function visibleItems() {
        const term = search.value.trim().toLowerCase();
        const ft = filterType.value;
        return items.filter((i) => {
          const bySearch = !term || (i.title + " " + i.category).toLowerCase().includes(term);
          const byType = ft === "all" || i.type === ft;
          return bySearch && byType;
        });
      }

      function totals(){
        const income = items.filter(i=>i.type==="income").reduce((a,b)=>a+b.amount,0);
        const expense = items.filter(i=>i.type==="expense").reduce((a,b)=>a+b.amount,0);
        const ym = new Date().toISOString().slice(0, 7);
        const monthExpense = items.filter(i => i.type === "expense" && String(i.date).startsWith(ym)).reduce((a,b)=>a+b.amount,0);
        inc.textContent = income.toFixed(2);
        exp.textContent = expense.toFixed(2);
        bal.textContent = (income-expense).toFixed(2);
        monthSpend.textContent = monthExpense.toFixed(2);
      }

      function render(){
        const list = visibleItems();
        rows.innerHTML = list.map(i=>`<tr><td>${esc(i.title)}</td><td>${esc(i.category)}</td><td class="${i.type}">${i.type}</td><td>${esc(i.date)}</td><td>${i.amount.toFixed(2)}</td><td><button data-id="${i.id}">Delete</button></td></tr>`).join("") || `<tr><td colspan="6" class="meta">No entries yet.</td></tr>`;
        totals();
      }

      addBtn.addEventListener("click", ()=>{
        const t = title.value.trim();
        const a = Number(amount.value);
        if(t.length<2 || !Number.isFinite(a) || a<=0){ alert("Enter valid title and amount."); return; }
        items.unshift({
          id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
          title:t,
          amount:a,
          type:type.value,
          category:category.value,
          date: entryDate.value || new Date().toISOString().slice(0, 10)
        });
        title.value=""; amount.value=""; type.value="expense"; category.value="General";
        save(); render();
      });

      rows.addEventListener("click",(e)=>{ const b=e.target; if(!(b instanceof HTMLButtonElement)) return; const id=b.dataset.id; items=items.filter(i=>i.id!==id); save(); render(); });
      search.addEventListener("input", render);
      filterType.addEventListener("change", render);

      exportBtn.addEventListener("click", () => {
        const header = "title,category,type,date,amount";
        const lines = items.map((i) => [i.title, i.category, i.type, i.date, i.amount.toFixed(2)].map((v) => `"${String(v).replace(/"/g, '""')}"`).join(","));
        const csv = [header].concat(lines).join("\n");
        const blob = new Blob([csv], { type: "text/csv" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "expense-tracker-krishiv-pb.csv";
        a.click();
        URL.revokeObjectURL(a.href);
      });

      load(); render();
    })();
  </script>

  <script src="app-universe-shell.js" defer></script>
</body>
</html>
