<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 140" role="img" aria-labelledby="title desc">
  <title id="title">Minecraft logo</title>
  <desc id="desc">Minecraft-inspired block wordmark on a layered terrain backdrop.</desc>
  <defs>
    <linearGradient id="mcSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#88d3ff"/>
      <stop offset="100%" stop-color="#355e2b"/>
    </linearGradient>
  </defs>
  <rect width="300" height="140" rx="24" fill="url(#mcSky)"/>
  <rect y="86" width="300" height="54" fill="#4f7f34"/>
  <rect y="82" width="300" height="10" fill="#6d4c2e"/>
  <g fill="#1f2937">
    <rect x="42" y="20" width="12" height="12"/>
    <rect x="246" y="34" width="10" height="10"/>
    <rect x="228" y="20" width="8" height="8"/>
  </g>
  <text x="150" y="82" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="42" fill="#f3f4f6" stroke="#1f2937" stroke-width="5" paint-order="stroke fill" letter-spacing="2">MINECRAFT</text>
  <rect x="136" y="50" width="14" height="14" fill="#1f2937"/>
</svg>
