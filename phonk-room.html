<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔥 Nitro Phonk Room - Audio Visualizer</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Space+Grotesk:wght@400;600;700&family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #ff0055;
      --primary-glow: rgba(255, 0, 85, 0.4);
      --secondary: #00f2ff;
      --secondary-glow: rgba(0, 242, 255, 0.4);
      --dark: #030712;
      --panel: rgba(15, 23, 42, 0.55);
      --border: rgba(0, 242, 255, 0.15);
    }
    
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--dark);
      color: #f8fafc;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }

    #visualizerCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background: radial-gradient(circle at center, #090d22 0%, #030712 100%);
    }

    .phonk-deck {
      position: relative;
      z-index: 10;
      width: 420px;
      background: var(--panel);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      text-align: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .phonk-deck:hover {
      border-color: rgba(0, 242, 255, 0.35);
      box-shadow: 0 35px 70px rgba(0, 242, 255, 0.12);
      transform: translateY(-4px);
    }

    .deck-header {
      margin-bottom: 24px;
    }

    .deck-header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 0 0 6px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .deck-header p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin: 0;
      font-family: 'Fira Code', monospace;
    }

    .vinyl-wrapper {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 0 auto 28px;
    }

    .phonk-vinyl {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, #1e293b 30%, #ff0055 35%, #0f172a 40%, #020617 80%, #000 100%);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: rotateVinyl 6s linear infinite;
      animation-play-state: paused;
    }

    .phonk-vinyl.playing {
      animation-play-state: running;
    }

    .vinyl-center {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #0f172a;
      border: 3px solid var(--secondary);
      box-shadow: inset 0 0 10px rgba(0, 242, 255, 0.5);
    }

    @keyframes rotateVinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .ctrl-btn.play-pause {
      width: 64px;
      height: 64px;
      background: rgba(0, 242, 255, 0.1);
      border-color: var(--secondary);
      color: var(--secondary);
      font-size: 1.5rem;
      box-shadow: 0 0 15px rgba(0, 242, 255, 0.15);
    }

    .ctrl-btn.play-pause:hover {
      background: rgba(0, 242, 255, 0.25);
      box-shadow: 0 0 25px rgba(0, 242, 255, 0.35);
      transform: scale(1.08);
    }

    .ctrl-btn.secondary-btn {
      width: 44px;
      height: 44px;
      font-size: 1rem;
    }

    .ctrl-btn.secondary-btn:hover {
      background: rgba(255, 0, 85, 0.15);
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.25);
      transform: scale(1.06);
    }

    .status-panel {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 18px;
    }

    .track-meta {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .track-genre {
      font-size: 0.78rem;
      color: var(--secondary);
      font-family: 'Fira Code', monospace;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .back-home {
      position: absolute;
      top: 30px;
      left: 30px;
      z-index: 100;
      color: #fff;
      text-decoration: none;
      font-family: 'Fira Code', monospace;
      font-weight: 700;
      font-size: 0.9rem;
      border: 1px solid var(--border);
      padding: 10px 22px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .back-home:hover {
      border-color: var(--secondary);
      box-shadow: 0 0 15px rgba(0, 242, 255, 0.25);
      transform: translateX(-4px);
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Exit Deck</a>

  <canvas id="visualizerCanvas"></canvas>

  <div class="phonk-deck">
    <div class="deck-header">
      <h1>Phonk Room</h1>
      <p>System Audio Analyzer Engine</p>
    </div>

    <div class="vinyl-wrapper">
      <div class="phonk-vinyl" id="vinylDeck">
        <div class="vinyl-center"></div>
      </div>
    </div>

    <div class="controls-row">
      <button class="ctrl-btn secondary-btn" id="volumeDownBtn" title="Volume Down"><i class="fas fa-volume-down"></i></button>
      <button class="ctrl-btn play-pause" id="playPauseBtn" title="Play Track"><i class="fas fa-play"></i></button>
      <button class="ctrl-btn secondary-btn" id="volumeUpBtn" title="Volume Up"><i class="fas fa-volume-up"></i></button>
    </div>

    <div class="status-panel">
      <div class="track-meta" id="trackTitle">Nitro Voltage (Phonk Cut)</div>
      <div class="track-genre">Cyber Phonk // 130 BPM</div>
    </div>
  </div>

  <audio id="phonkAudio" src="nitro_voltage.mp3" loop crossorigin="anonymous"></audio>

  <script>
    const canvas = document.getElementById("visualizerCanvas");
    const ctx = canvas.getContext("2d");
    const audio = document.getElementById("phonkAudio");
    const playPauseBtn = document.getElementById("playPauseBtn");
    const vinylDeck = document.getElementById("vinylDeck");
    
    // Resize canvas
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    let audioCtx = null;
    let analyser = null;
    let source = null;
    let dataArray = [];
    let isInitialized = false;

    function initAudioContext() {
      if (isInitialized) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      
      source = audioCtx.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      
      const bufferLength = analyser.frequencyBinCount;
      dataArray = new Uint8Array(bufferLength);
      isInitialized = true;
    }

    // Play/Pause Action
    playPauseBtn.addEventListener("click", () => {
      initAudioContext();
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }

      if (audio.paused) {
        audio.play().then(() => {
          playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
          vinylDeck.classList.add("playing");
        }).catch(err => console.log("Play failed: ", err));
      } else {
        audio.pause();
        playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
        vinylDeck.classList.remove("playing");
      }
    });

    // Volume adjustment
    document.getElementById("volumeUpBtn").addEventListener("click", () => {
      audio.volume = Math.min(1.0, audio.volume + 0.1);
    });
    document.getElementById("volumeDownBtn").addEventListener("click", () => {
      audio.volume = Math.max(0.0, audio.volume - 0.1);
    });

    // Drawing particle flow & frequencies
    let particles = [];
    for (let i = 0; i < 60; i++) {
      particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 3 + 1,
        speedX: Math.random() * 1 - 0.5,
        speedY: Math.random() * 1 - 0.5,
        color: Math.random() > 0.5 ? "rgba(255, 0, 85, 0.3)" : "rgba(0, 242, 255, 0.3)"
      });
    }

    function draw() {
      requestAnimationFrame(draw);
      
      // Clear canvas with trace effect
      ctx.fillStyle = "rgba(3, 7, 18, 0.2)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      let averageBass = 0;
      if (isInitialized) {
        analyser.getByteFrequencyData(dataArray);
        averageBass = dataArray[0] + dataArray[1] + dataArray[2] + dataArray[3];
        averageBass = averageBass / 4;
      }
      
      // 1. Draw glowing circles reacting to Bass
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const baseRadius = 140 + (averageBass * 0.45);
      
      ctx.shadowBlur = 30 + (averageBass * 0.1);
      ctx.shadowColor = "rgba(0, 242, 255, 0.5)";
      
      ctx.strokeStyle = "rgba(0, 242, 255, 0.25)";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(centerX, centerY, baseRadius, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = "rgba(255, 0, 85, 0.2)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(centerX, centerY, baseRadius + 40, 0, Math.PI * 2);
      ctx.stroke();

      ctx.shadowBlur = 0; // reset shadow

      // 2. Frequencies bar ring
      if (isInitialized) {
        const barCount = 64;
        const radius = baseRadius - 10;
        ctx.lineWidth = 4;
        
        for (let i = 0; i < barCount; i++) {
          const value = dataArray[i] || 0;
          const barHeight = (value / 255) * 80;
          
          const angle = (i / barCount) * Math.PI * 2;
          const xStart = centerX + Math.cos(angle) * radius;
          const yStart = centerY + Math.sin(angle) * radius;
          const xEnd = centerX + Math.cos(angle) * (radius + barHeight);
          const yEnd = centerY + Math.sin(angle) * (radius + barHeight);
          
          const grad = ctx.createLinearGradient(xStart, yStart, xEnd, yEnd);
          grad.addColorStop(0, "rgba(0, 242, 255, 0.8)");
          grad.addColorStop(1, "rgba(255, 0, 85, 0.8)");
          
          ctx.strokeStyle = grad;
          ctx.beginPath();
          ctx.moveTo(xStart, yStart);
          ctx.lineTo(xEnd, yEnd);
          ctx.stroke();
        }
      }

      // 3. Update & render particles
      particles.forEach(p => {
        p.x += p.speedX * (1 + averageBass * 0.05);
        p.y += p.speedY * (1 + averageBass * 0.05);
        
        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;
        
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size + (averageBass * 0.02), 0, Math.PI * 2);
        ctx.fill();
      });
    }

    draw();
  </script>
</body>
</html>
