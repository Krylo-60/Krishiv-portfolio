<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Krishiv PB" />
  <title>Study Planner App</title>
  <style>
    :root {
      --bg: #061425;
      --panel: #0e2239;
      --panel-2: #123052;
      --line: #2f5277;
      --text: #f1f7ff;
      --muted: #a9c4e6;
      --ok: #47d3a5;
      --warn: #ffd166;
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(165deg, #04101d, #0d2440 48%, #0f3055);
      min-height: 100vh;
    }
    .wrap { width: min(980px, 94%); margin: 24px auto; }
    .card {
      background: linear-gradient(160deg, rgba(18,48,82,.95), rgba(10,28,49,.95));
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 20px 46px rgba(0,0,0,.28);
    }
    h1, h2 { margin: 0 0 10px; }
    p { color: var(--muted); }
    .grid { display: grid; gap: 12px; grid-template-columns: 1.1fr .9fr; }
    .field { margin-bottom: 10px; }
    label { display: block; font-size: .9rem; color: var(--muted); margin-bottom: 6px; }
    input, select, textarea, button {
      width: 100%; border-radius: 10px; border: 1px solid var(--line);
      background: var(--bg); color: var(--text); padding: 10px; font: inherit;
    }
    textarea { min-height: 74px; resize: vertical; }
    .btn { cursor: pointer; font-weight: 700; }
    .btn.primary { background: linear-gradient(135deg, #5ce1e6, #47d3a5); color: #032033; border: none; }
    .btn.row { width: auto; padding: 8px 10px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .task {
      border: 1px solid var(--line); border-radius: 12px; padding: 10px;
      background: rgba(5,20,36,.75); margin-bottom: 8px;
    }
    .task-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .task .meta { color: var(--muted); font-size: .87rem; margin-top: 4px; }
    .task.done { border-color: rgba(71,211,165,.6); opacity: .9; }
    .pill { font-size: .78rem; border-radius: 999px; padding: 3px 8px; border: 1px solid var(--line); }
    .priority-high { color: #ffd9d9; border-color: rgba(255,107,107,.5); }
    .priority-med { color: #fff0c2; border-color: rgba(255,209,102,.5); }
    .priority-low { color: #c8ffeb; border-color: rgba(71,211,165,.5); }
    .stats { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; margin-top: 8px; }
    .stat { padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: rgba(5,20,36,.75); }
    .empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; padding: 14px; text-align: center; }
    a { color: #93d4ff; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } .stats { grid-template-columns: 1fr; } }
  </style>

  <link rel="stylesheet" href="app-universe-shell.css" />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
</head>
<body>
  <main class="wrap">
    <section class="card" style="margin-bottom:12px;">
      <h1>Study Planner App</h1>
      <p>Plan homework, exams, and priorities. Data is saved in your browser.</p>
      <p>Created by Krishiv PB</p>
      <a href="index.html#projects">Back to portfolio</a>
    </section>
    <section class="grid">
      <article class="card">
        <h2>Add Study Task</h2>
        <div class="field">
          <label for="title">Task title</label>
          <input id="title" maxlength="80" placeholder="Math revision chapter 4" />
        </div>
        <div class="field">
          <label for="subject">Subject</label>
          <input id="subject" maxlength="40" placeholder="Mathematics" />
        </div>
        <div class="row">
          <div class="field" style="flex:1;">
            <label for="dueDate">Due date</label>
            <input id="dueDate" type="date" />
          </div>
          <div class="field" style="flex:1;">
            <label for="priority">Priority</label>
            <select id="priority">
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="notes">Notes</label>
          <textarea id="notes" maxlength="220" placeholder="Main formulas and examples to practice"></textarea>
        </div>
        <button id="addBtn" class="btn primary">Add Task</button>
      </article>
      <article class="card">
        <h2>Planner Stats</h2>
        <div class="stats">
          <div class="stat"><strong id="totalCount">0</strong><div>Total tasks</div></div>
          <div class="stat"><strong id="openCount">0</strong><div>Open tasks</div></div>
          <div class="stat"><strong id="doneCount">0</strong><div>Completed</div></div>
        </div>
      </article>
    </section>
    <section class="card" style="margin-top:12px;">
      <div class="row" style="justify-content:space-between;align-items:center;">
        <h2>Task List</h2>
        <button id="clearDoneBtn" class="btn row">Clear Completed</button>
      </div>
      <div class="row" style="margin-bottom:8px;">
        <input id="taskSearch" placeholder="Search title, subject, notes..." style="max-width:320px;" />
        <select id="taskSort" style="max-width:220px;">
          <option value="newest">Sort: Newest</option>
          <option value="due">Sort: Due Date</option>
          <option value="priority">Sort: Priority</option>
          <option value="open-first">Sort: Open First</option>
        </select>
        <button id="exportBtn" class="btn row" type="button">Export</button>
        <button id="importBtn" class="btn row" type="button">Import</button>
        <input id="importFile" type="file" accept=".json,application/json" style="display:none;" />
      </div>
      <div id="taskList"></div>
    </section>
  </main>
  <script>
    (() => {
      const storageKey = "krishiv_study_planner_v1";
      const titleInput = document.getElementById("title");
      const subjectInput = document.getElementById("subject");
      const dueDateInput = document.getElementById("dueDate");
      const priorityInput = document.getElementById("priority");
      const notesInput = document.getElementById("notes");
      const addBtn = document.getElementById("addBtn");
      const clearDoneBtn = document.getElementById("clearDoneBtn");
      const taskSearch = document.getElementById("taskSearch");
      const taskSort = document.getElementById("taskSort");
      const exportBtn = document.getElementById("exportBtn");
      const importBtn = document.getElementById("importBtn");
      const importFile = document.getElementById("importFile");
      const taskList = document.getElementById("taskList");
      const totalCount = document.getElementById("totalCount");
      const openCount = document.getElementById("openCount");
      const doneCount = document.getElementById("doneCount");

      let tasks = [];

      function load() {
        try {
          const raw = localStorage.getItem(storageKey);
          tasks = raw ? JSON.parse(raw) : [];
          if (!Array.isArray(tasks)) tasks = [];
        } catch {
          tasks = [];
        }
      }

      function save() {
        localStorage.setItem(storageKey, JSON.stringify(tasks));
      }

      function fmtDate(value) {
        if (!value) return "No due date";
        const d = new Date(value + "T00:00:00");
        return isNaN(d.getTime()) ? "No due date" : d.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
      }

      function updateStats() {
        const total = tasks.length;
        const done = tasks.filter((t) => t.done).length;
        totalCount.textContent = String(total);
        doneCount.textContent = String(done);
        openCount.textContent = String(total - done);
      }

      function priorityRank(value) {
        return value === "high" ? 0 : value === "medium" ? 1 : 2;
      }

      function getVisibleTasks() {
        const term = String(taskSearch ? taskSearch.value : "").toLowerCase().trim();
        const sortMode = String(taskSort ? taskSort.value : "newest");
        let list = [...tasks];
        if (term) {
          list = list.filter((t) => {
            const hay = [t.title, t.subject, t.notes].join(" ").toLowerCase();
            return hay.includes(term);
          });
        }
        if (sortMode === "due") {
          list.sort((a, b) => {
            const ad = a.dueDate ? new Date(a.dueDate).getTime() : Number.MAX_SAFE_INTEGER;
            const bd = b.dueDate ? new Date(b.dueDate).getTime() : Number.MAX_SAFE_INTEGER;
            return ad - bd;
          });
        } else if (sortMode === "priority") {
          list.sort((a, b) => priorityRank(a.priority) - priorityRank(b.priority));
        } else if (sortMode === "open-first") {
          list.sort((a, b) => Number(a.done) - Number(b.done));
        }
        return list;
      }

      function render() {
        const visible = getVisibleTasks();
        if (!visible.length) {
          taskList.innerHTML = '<div class="empty">No tasks yet. Add your first study task.</div>';
          updateStats();
          return;
        }

        taskList.innerHTML = visible.map((task) => {
          const priorityClass = task.priority === "high" ? "priority-high" : (task.priority === "medium" ? "priority-med" : "priority-low");
          return `
            <article class="task ${task.done ? "done" : ""}">
              <div class="task-top">
                <strong>${escapeHtml(task.title)}</strong>
                <span class="pill ${priorityClass}">${escapeHtml(task.priority)}</span>
              </div>
              <div class="meta">${escapeHtml(task.subject || "General")} | Due: ${escapeHtml(fmtDate(task.dueDate))}</div>
              ${task.notes ? `<p>${escapeHtml(task.notes)}</p>` : ""}
              <div class="row">
                <button class="btn row" data-action="toggle" data-id="${task.id}">${task.done ? "Mark Open" : "Mark Done"}</button>
                <button class="btn row" data-action="delete" data-id="${task.id}">Delete</button>
              </div>
            </article>
          `;
        }).join("");
        updateStats();
      }

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      addBtn.addEventListener("click", () => {
        const title = titleInput.value.trim();
        const subject = subjectInput.value.trim();
        const dueDate = dueDateInput.value;
        const priority = priorityInput.value;
        const notes = notesInput.value.trim();

        if (title.length < 3) {
          alert("Task title must be at least 3 characters.");
          return;
        }

        const task = {
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
          title,
          subject,
          dueDate,
          priority,
          notes,
          done: false
        };

        tasks.unshift(task);
        save();
        render();
        titleInput.value = "";
        subjectInput.value = "";
        dueDateInput.value = "";
        priorityInput.value = "high";
        notesInput.value = "";
      });

      clearDoneBtn.addEventListener("click", () => {
        tasks = tasks.filter((t) => !t.done);
        save();
        render();
      });

      if (taskSearch) taskSearch.addEventListener("input", render);
      if (taskSort) taskSort.addEventListener("change", render);

      exportBtn.addEventListener("click", () => {
        const payload = JSON.stringify(tasks, null, 2);
        const blob = new Blob([payload], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "study-planner-tasks.json";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      });

      importBtn.addEventListener("click", () => importFile.click());
      importFile.addEventListener("change", async () => {
        const file = importFile.files && importFile.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const parsed = JSON.parse(text);
          if (!Array.isArray(parsed)) throw new Error("Invalid file");
          tasks = parsed.filter((t) => t && typeof t === "object" && t.title);
          save();
          render();
        } catch {
          alert("Invalid JSON file.");
        } finally {
          importFile.value = "";
        }
      });

      taskList.addEventListener("click", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLButtonElement)) return;
        const action = target.dataset.action;
        const id = target.dataset.id;
        if (!id) return;

        if (action === "toggle") {
          tasks = tasks.map((t) => t.id === id ? { ...t, done: !t.done } : t);
        } else if (action === "delete") {
          tasks = tasks.filter((t) => t.id !== id);
        }
        save();
        render();
      });

      load();
      render();
    })();
  </script>

  <script src="app-universe-shell.js" defer></script>
</body>
</html>
