<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Flashcards Pro | Krishiv PB</title>
  <link rel="stylesheet" href="app-universe-shell.css"/>
  <link rel="icon" href="logo.svg" type="image/svg+xml"/>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@400;500;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;}body{margin:0;font-family:"Space Grotesk",sans-serif;color:#eef7ff;background:linear-gradient(160deg,#030a14,#0a223a 48%,#123860);min-height:100vh;}
    h1,h2{font-family:"Orbitron",sans-serif;margin:0 0 8px;}p{color:#a9c6e7;margin:0 0 8px;}
    .wrap{width:min(900px,94%);margin:24px auto;}
    .card{border:1px solid #365f88;border-radius:14px;padding:20px;background:linear-gradient(160deg,rgba(18,40,68,.96),rgba(9,22,41,.96));margin-bottom:14px;}
    input,select,textarea{padding:10px;border-radius:10px;border:1px solid #365f88;background:#0a1b31;color:#eef7ff;font:inherit;transition:border-color .2s;width:100%;}
    input:focus,select:focus,textarea:focus{outline:none;border-color:#79d8ff;}
    .btn{cursor:pointer;font-weight:700;padding:10px 18px;border-radius:10px;border:none;transition:all .2s;font-family:inherit;}
    .btn.primary{background:linear-gradient(135deg,#79d8ff,#58d4a8);color:#032333;}
    .btn.sm{padding:7px 14px;font-size:.83rem;}
    .btn.ghost{background:transparent;border:1px solid #365f88;color:#a9c6e7;}
    .btn.danger{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.3);color:#ff9999;}
    .btn.ok{background:rgba(86,213,166,.15);border:1px solid rgba(86,213,166,.4);color:#56d5a6;}
    .btn:hover{opacity:.85;transform:translateY(-1px);}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
    .stat{border:1px solid #365f88;border-radius:12px;padding:12px;text-align:center;background:rgba(5,16,30,.6);}
    .stat strong{display:block;font-size:1.4rem;font-family:"JetBrains Mono",monospace;color:#79d8ff;}
    .stat span{font-size:.72rem;color:#a9c6e7;}
    /* DECK SELECTOR */
    .deck-row{display:flex;gap:8px;margin-bottom:14px;}
    /* FLIP CARD */
    .flashcard-scene{perspective:1000px;width:100%;max-width:520px;height:240px;margin:0 auto 20px;cursor:pointer;}
    .flashcard{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,0,.2,1);}
    .flashcard.flipped{transform:rotateY(180deg);}
    .flashcard-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;}
    .flashcard-front{background:linear-gradient(135deg,rgba(18,52,92,.96),rgba(9,27,51,.98));border:2px solid rgba(121,216,255,.4);}
    .flashcard-back{background:linear-gradient(135deg,rgba(10,36,22,.96),rgba(6,22,14,.98));border:2px solid rgba(86,213,166,.4);transform:rotateY(180deg);}
    .card-text{font-size:1.15rem;font-weight:600;line-height:1.5;}
    .card-hint{font-size:.78rem;font-family:"JetBrains Mono",monospace;position:absolute;bottom:12px;right:14px;color:#6b8fad;}
    /* CONTROLS */
    .controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px;}
    /* PROGRESS */
    .prog-bar{height:6px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;margin-bottom:6px;}
    .prog-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#79d8ff,#56d5a6);transition:width .4s;}
    .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.72rem;font-family:"JetBrains Mono",monospace;}
    .badge.green{background:rgba(86,213,166,.12);border:1px solid rgba(86,213,166,.3);color:#56d5a6;}
    .badge.yellow{background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.3);color:#ffd166;}
    .badge.red{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.3);color:#ff9999;}
    /* CARD LIST */
    .fc-item{border:1px solid rgba(84,126,171,.25);border-radius:10px;padding:12px;margin-bottom:8px;background:rgba(5,16,30,.5);display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center;}
    .fc-q{font-size:.85rem;font-weight:600;}
    .fc-a{font-size:.82rem;color:#56d5a6;}
    .empty{color:#a9c6e7;border:1px dashed #365f88;border-radius:12px;padding:24px;text-align:center;}
    @media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr);}.fc-item{grid-template-columns:1fr;}}
  </style>
</head>
<body class="app-theme-root">
<main class="wrap">
  <section class="card">
    <h1>🃏 Flashcards Pro</h1>
    <p>Create decks, flip cards, track what you know. All saved locally.</p>
    <a href="index.html" style="color:#9edcff;font-size:.85rem;">← Back to portfolio</a>
  </section>

  <!-- STATS -->
  <div class="stats">
    <div class="stat"><strong id="sTotal">0</strong><span>Total cards</span></div>
    <div class="stat"><strong id="sKnow">0</strong><span>Known ✅</span></div>
    <div class="stat"><strong id="sLearn">0</strong><span>Learning 🔄</span></div>
    <div class="stat"><strong id="sDecks">0</strong><span>Decks</span></div>
  </div>

  <!-- DECK MANAGE -->
  <section class="card">
    <div class="deck-row">
      <input id="deckName" placeholder="New deck name..." style="flex:1;"/>
      <button class="btn primary" id="addDeckBtn">+ Deck</button>
      <select id="deckSelect" style="flex:1;"></select>
      <button class="btn danger sm" id="deleteDeckBtn">🗑 Deck</button>
    </div>
    <div class="row" style="margin-bottom:10px;">
      <textarea id="qInput" placeholder="Question / Front" style="flex:1;min-height:60px;resize:none;"></textarea>
      <textarea id="aInput" placeholder="Answer / Back" style="flex:1;min-height:60px;resize:none;"></textarea>
      <button class="btn primary" id="addCardBtn">+ Card</button>
    </div>
    <div style="font-size:.8rem;color:#a9c6e7;">💡 Tip: Add multiple cards fast, then study with the flipper above.</div>
  </section>

  <!-- STUDY MODE -->
  <section class="card" id="studySection" style="display:none;">
    <div class="row" style="justify-content:space-between;margin-bottom:10px;">
      <h2>📖 Study Mode</h2>
      <div class="row">
        <span id="cardCounter" style="font-family:'JetBrains Mono',monospace;font-size:.85rem;color:#a9c6e7;"></span>
        <button class="btn ghost sm" id="shuffleBtn">🔀 Shuffle</button>
        <button class="btn ghost sm" id="stopStudyBtn">✕ Stop</button>
      </div>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="studyProg" style="width:0%"></div></div>
    <div class="flashcard-scene" id="cardScene" onclick="flipCard()">
      <div class="flashcard" id="flashcard">
        <div class="flashcard-face flashcard-front"><span class="card-text" id="frontText"></span><span class="card-hint">Click to flip</span></div>
        <div class="flashcard-face flashcard-back"><span class="card-text" id="backText"></span><span class="card-hint">Rate yourself</span></div>
      </div>
    </div>
    <div class="controls">
      <button class="btn danger" id="hardBtn">😰 Hard</button>
      <button class="btn ghost" id="flipBtn" onclick="flipCard()">🔄 Flip</button>
      <button class="btn ok" id="gotBtn">✅ Got It</button>
    </div>
    <div id="sessionResult" style="display:none;text-align:center;padding:20px;">
      <div style="font-size:2rem;margin-bottom:10px;">🎉</div>
      <div style="font-family:'Orbitron',sans-serif;font-size:1.1rem;margin-bottom:8px;">Session Complete!</div>
      <div id="sessionScore" style="color:#a9c6e7;font-size:.9rem;margin-bottom:12px;"></div>
      <button class="btn primary" id="restartBtn">↺ Study Again</button>
    </div>
  </section>

  <!-- CARD LIST -->
  <section class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:10px;">
      <h2>📋 Cards in Deck</h2>
      <button class="btn primary sm" id="startStudyBtn">▶ Study Now</button>
    </div>
    <div id="cardList"></div>
  </section>
</main>

<script>
(() => {
  const LSK = 'krishiv_fc_v2';
  let data = {decks:{}}, activeDeck = '', studyQueue = [], studyIdx = 0, isFlipped = false, sessionGot = 0, sessionHard = 0;

  function load(){try{data=JSON.parse(localStorage.getItem(LSK)||'{"decks":{}}');if(!data.decks)data.decks={};}catch{data={decks:{}};}}
  function save(){localStorage.setItem(LSK,JSON.stringify(data));}
  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function getDeck(){return data.decks[activeDeck]||{cards:[]};}

  function renderDecks(){
    const sel=document.getElementById('deckSelect');
    const keys=Object.keys(data.decks);
    sel.innerHTML=keys.length?keys.map(k=>`<option value="${esc(k)}">${esc(k)} (${data.decks[k].cards.length})</option>`):'<option value="">No decks yet</option>';
    if(!activeDeck||!data.decks[activeDeck])activeDeck=keys[0]||'';
    if(activeDeck)sel.value=activeDeck;
  }

  function renderStats(){
    const allCards=Object.values(data.decks).flatMap(d=>d.cards);
    document.getElementById('sTotal').textContent=allCards.length;
    document.getElementById('sKnow').textContent=allCards.filter(c=>c.status==='know').length;
    document.getElementById('sLearn').textContent=allCards.filter(c=>c.status==='learn').length;
    document.getElementById('sDecks').textContent=Object.keys(data.decks).length;
  }

  function renderCards(){
    const deck=getDeck();
    const list=document.getElementById('cardList');
    if(!activeDeck||!deck.cards.length){list.innerHTML='<div class="empty">No cards in this deck. Add some above!</div>';return;}
    list.innerHTML=deck.cards.map((c,i)=>`
      <div class="fc-item">
        <div class="fc-q">Q: ${esc(c.q)}</div>
        <div class="fc-a">A: ${esc(c.a)}</div>
        <div class="row">
          <span class="badge ${c.status==='know'?'green':c.status==='learn'?'yellow':'yellow'}">${c.status==='know'?'✅ Known':c.status==='hard'?'😰 Hard':'🔄 Learning'}</span>
          <button class="btn danger sm" onclick="deleteCard(${i})">🗑</button>
        </div>
      </div>`).join('');
  }

  function render(){renderDecks();renderStats();renderCards();}

  // Add deck
  document.getElementById('addDeckBtn').addEventListener('click',()=>{
    const name=document.getElementById('deckName').value.trim();
    if(!name){alert('Enter a deck name!');return;}
    if(!data.decks[name])data.decks[name]={cards:[]};
    activeDeck=name;save();render();document.getElementById('deckName').value='';
  });

  document.getElementById('deleteDeckBtn').addEventListener('click',()=>{
    if(!activeDeck||!confirm(`Delete deck "${activeDeck}"?`))return;
    delete data.decks[activeDeck];activeDeck=Object.keys(data.decks)[0]||'';save();render();
  });

  document.getElementById('deckSelect').addEventListener('change',e=>{activeDeck=e.target.value;render();});

  // Add card
  document.getElementById('addCardBtn').addEventListener('click',()=>{
    const q=document.getElementById('qInput').value.trim();
    const a=document.getElementById('aInput').value.trim();
    if(!q||!a){alert('Fill in both question and answer!');return;}
    if(!activeDeck){alert('Select or create a deck first!');return;}
    getDeck().cards.push({q,a,status:'learn'});
    save();render();document.getElementById('qInput').value='';document.getElementById('aInput').value='';
  });

  window.deleteCard=i=>{if(!confirm('Delete card?'))return;getDeck().cards.splice(i,1);save();render();};

  // STUDY
  function startStudy(){
    const cards=getDeck().cards;
    if(!cards.length){alert('No cards in this deck!');return;}
    studyQueue=[...cards];studyIdx=0;sessionGot=0;sessionHard=0;isFlipped=false;
    document.getElementById('studySection').style.display='';
    document.getElementById('sessionResult').style.display='none';
    document.getElementById('cardScene').style.display='';
    document.querySelectorAll('.controls button').forEach(b=>b.style.display='');
    showCard();
  }

  function showCard(){
    if(studyIdx>=studyQueue.length){endStudy();return;}
    const c=studyQueue[studyIdx];
    isFlipped=false;
    document.getElementById('flashcard').classList.remove('flipped');
    document.getElementById('frontText').textContent=c.q;
    document.getElementById('backText').textContent=c.a;
    document.getElementById('cardCounter').textContent=`${studyIdx+1} / ${studyQueue.length}`;
    document.getElementById('studyProg').style.width=Math.round(studyIdx/studyQueue.length*100)+'%';
  }

  window.flipCard=()=>{isFlipped=!isFlipped;document.getElementById('flashcard').classList.toggle('flipped',isFlipped);};

  document.getElementById('shuffleBtn').addEventListener('click',()=>{
    for(let i=studyQueue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[studyQueue[i],studyQueue[j]]=[studyQueue[j],studyQueue[i]];}
    studyIdx=0;showCard();
  });

  document.getElementById('gotBtn').addEventListener('click',()=>{
    const c=getDeck().cards.find(x=>x.q===studyQueue[studyIdx]?.q);if(c)c.status='know';
    sessionGot++;studyIdx++;save();showCard();
  });

  document.getElementById('hardBtn').addEventListener('click',()=>{
    const c=getDeck().cards.find(x=>x.q===studyQueue[studyIdx]?.q);if(c)c.status='hard';
    sessionHard++;studyIdx++;save();showCard();
  });

  document.getElementById('stopStudyBtn').addEventListener('click',()=>{document.getElementById('studySection').style.display='none';});
  document.getElementById('startStudyBtn').addEventListener('click',startStudy);
  document.getElementById('restartBtn').addEventListener('click',startStudy);

  function endStudy(){
    document.getElementById('cardScene').style.display='none';
    document.querySelectorAll('.controls button').forEach(b=>b.style.display='none');
    document.getElementById('sessionResult').style.display='';
    document.getElementById('sessionScore').textContent=`✅ Got it: ${sessionGot} · 😰 Hard: ${sessionHard} · 📊 ${Math.round(sessionGot/studyQueue.length*100)}% score`;
    render();
  }

  load();render();
})();
</script>

  <script src="app-catalog.js"></script>
  <script src="app-universe-shell.js" defer></script>
  <script src="usage-tracker.js" defer></script>
</body></html>
