<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 120" role="img" aria-labelledby="title desc">
  <title id="title">Clash Royale Logo</title>
  <desc id="desc">Clash Royale style wordmark with shield badge on the right.</desc>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f7fb"/>
      <stop offset="52%" stop-color="#bcc4d2"/>
      <stop offset="100%" stop-color="#7e8798"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe39a"/>
      <stop offset="52%" stop-color="#e5a93e"/>
      <stop offset="100%" stop-color="#965f16"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0be"/>
      <stop offset="100%" stop-color="#cb8628"/>
    </linearGradient>
    <linearGradient id="blueShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ca3ff"/>
      <stop offset="100%" stop-color="#2250a6"/>
