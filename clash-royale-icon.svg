    <text x="8" y="78" font-size="44" fill="url(#gold)" letter-spacing="0.7">ROYALE</text>
  </g>

  <g transform="translate(156 14)">
    <path d="M30 2l28 9v25c0 18-13 30-28 37C15 66 2 54 2 36V11z" fill="url(#gold)"/>
    <path d="M30 6l23 8v21c0 15-10 24-23 31C17 59 7 50 7 35V14z" fill="url(#goldEdge)"/>
    <path d="M30 10l18 6v18c0 13-8 21-18 27C20 55 12 47 12 34V16z" fill="url(#blueShield)"/>
    <path d="M30 10v51" stroke="#2f61bf" stroke-opacity="0.35"/>
    <path d="M21 13v42" stroke="#2f61bf" stroke-opacity="0.25"/>
    <path d="M39 13v42" stroke="#2f61bf" stroke-opacity="0.25"/>

    <g transform="translate(14 22)">
      <path d="M0 8l6-8 8 6 8-6 6 8v7H0z" fill="#f3c45b"/>
      <path d="M6 13h16v5H6z" fill="#d48f24"/>
      <path d="M14 6c9 0 16 6 16 13 0 6-5 11-11 13l-5 6-5-6C3 30-2 25-2 19-2 12 5 6 14 6z" fill="#f1b346"/>
      <path d="M14 10c6 0 11 4 11 8 0 4-4 7-8 8l-3 3-3-3c-4-1-8-4-8-8 0-4 5-8 11-8z" fill="#ffd27b"/>
      <path d="M14 16l3 3-3 3-3-3z" fill="#d38220"/>
