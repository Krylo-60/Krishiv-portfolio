<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 120" role="img" aria-labelledby="title desc">
  <title id="title">Free Fire MAX Gold Logo</title>
  <desc id="desc">Gold FREE FIRE MAX lockup with centered lightning knife I and horizontal bar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1208"/>
      <stop offset="100%" stop-color="#2d1b0b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe8af"/>
      <stop offset="52%" stop-color="#dfb14c"/>
      <stop offset="100%" stop-color="#9f6c18"/>
    </linearGradient>
  </defs>

  <g fill="url(#gold)">
    <text x="54" y="54" font-size="26" font-weight="800" font-family="Impact, Arial Black, Arial, sans-serif" letter-spacing="0.9">FREE F</text>
    <text x="123" y="54" font-size="26" font-weight="800" font-family="Impact, Arial Black, Arial, sans-serif" letter-spacing="0.9">I</text>
    <text x="132" y="54" font-size="26" font-weight="800" font-family="Impact, Arial Black, Arial, sans-serif" letter-spacing="0.9">RE</text>

    <path d="M34 69h52v9H34z"/>
    <path d="M186 69h-52v9h52z"/>
    <text x="110" y="95" text-anchor="middle" font-size="18" font-weight="800" font-family="Impact, Arial Black, Arial, sans-serif" letter-spacing="0.9">MAX</text>
  </g>
</svg>
