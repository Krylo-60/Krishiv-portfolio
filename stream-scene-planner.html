<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Stream Scene Planner | Krishiv PB</title>
  <link rel="stylesheet" href="app-universe-shell.css"/>
  <link rel="icon" href="logo.svg" type="image/svg+xml"/>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@400;500;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;}body{margin:0;font-family:"Space Grotesk",sans-serif;color:#eef7ff;background:linear-gradient(160deg,#030a14,#0a223a 48%,#123860);min-height:100vh;}
    h1,h2{font-family:"Orbitron",sans-serif;margin:0 0 10px;}p{color:#a9c6e7;margin:0 0 8px;}
    .wrap{width:min(960px,94%);margin:24px auto;}
    .card{border:1px solid #365f88;border-radius:14px;padding:20px;background:linear-gradient(160deg,rgba(18,40,68,.96),rgba(9,22,41,.96));margin-bottom:14px;}
    input,select,textarea{padding:10px;border-radius:10px;border:1px solid #365f88;background:#0a1b31;color:#eef7ff;font:inherit;width:100%;transition:border-color .2s;}
    input:focus,select:focus,textarea:focus{outline:none;border-color:#79d8ff;}
    .btn{cursor:pointer;font-weight:700;padding:10px 18px;border-radius:10px;border:none;font-family:inherit;transition:all .2s;}
    .btn.primary{background:linear-gradient(135deg,#79d8ff,#58d4a8);color:#032333;}
    .btn.sm{padding:6px 12px;font-size:.82rem;}
    .btn.ghost{background:transparent;border:1px solid #365f88;color:#a9c6e7;}
    .btn.danger{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.3);color:#ff9999;}
    .btn:hover{opacity:.85;transform:translateY(-1px);}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .item{border:1px solid rgba(84,126,171,.3);border-radius:10px;padding:12px;margin-bottom:8px;background:rgba(5,16,30,.65);display:flex;align-items:flex-start;gap:12px;transition:border-color .2s;}
    .item:hover{border-color:rgba(121,216,255,.25);}
    .item-info{flex:1;min-width:0;}
    .item-title{font-weight:700;font-size:.9rem;margin:0 0 4px;}
    .item-meta{font-size:.75rem;color:#a9c6e7;font-family:"JetBrains Mono",monospace;display:block;margin-bottom:2px;}
    .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.7rem;font-family:"JetBrains Mono",monospace;background:rgba(121,216,255,.1);border:1px solid rgba(121,216,255,.25);color:#79d8ff;margin-top:4px;}
    .empty{color:#a9c6e7;border:1px dashed #365f88;border-radius:12px;padding:24px;text-align:center;}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
    .stat{border:1px solid #365f88;border-radius:12px;padding:12px;text-align:center;background:rgba(5,16,30,.6);}
    .stat strong{display:block;font-size:1.4rem;font-family:"JetBrains Mono",monospace;color:#79d8ff;}
    .stat span{font-size:.72rem;color:#a9c6e7;}
    @media(max-width:600px){.grid2{grid-template-columns:1fr;}.stats{grid-template-columns:repeat(2,1fr);}}
  
    .progress-wrap{margin:10px 0;}
    .progress-bar{height:7px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;}
    .progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#79d8ff,#56d5a6);transition:width .5s;}
    .tag-row{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0;}
    .tag{padding:3px 9px;border-radius:999px;font-size:.7rem;font-family:"JetBrains Mono",monospace;background:rgba(121,216,255,.08);border:1px solid rgba(121,216,255,.2);color:#79d8ff;cursor:pointer;}
    .tag:hover{background:rgba(121,216,255,.18);}
    .sort-row{display:flex;gap:6px;align-items:center;font-size:.8rem;color:#a9c6e7;}
    .sort-btn{padding:4px 10px;border-radius:8px;border:1px solid #365f88;background:#0a1b31;color:#a9c6e7;cursor:pointer;font-size:.78rem;}
    .sort-btn.active{border-color:#79d8ff;color:#79d8ff;}
    .bulk-bar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:10px;background:rgba(121,216,255,.06);border:1px solid rgba(121,216,255,.15);margin-bottom:8px;font-size:.82rem;}
    .import-btn{cursor:pointer;padding:6px 12px;border-radius:8px;border:1px solid #365f88;background:#0a1b31;color:#a9c6e7;font-size:.8rem;}

  </style>
</head>
<body class="app-theme-root">
<main class="wrap">
  <section class="card">
    <h1>🎬 Stream Scene Planner</h1>
    <p>Plan your stream scenes and overlays.</p>
    <a href="index.html" style="color:#9edcff;font-size:.85rem;">Back to portfolio</a>
  </section>
  <div class="stats">
    <div class="stat"><strong id="sTotal">0</strong><span>Total scenes</span></div>
    <div class="stat"><strong id="sThis">0</strong><span>This week</span></div>
    <div class="stat"><strong id="sStar">0</strong><span>Starred ⭐</span></div>
  </div>
  <section class="card">
    <h2>Add Scene</h2>
    <div class="grid2" style="margin-bottom:10px;">
      <div><label style="font-size:.8rem;color:#a9c6e7;">Scene Name</label><input id="f0" placeholder="Scene Name..."/></div>
<div><label style="font-size:.8rem;color:#a9c6e7;">Duration</label><input id="f1" placeholder="Duration..."/></div>
<div><label style="font-size:.8rem;color:#a9c6e7;">Overlay Notes</label><textarea id="f2" placeholder="Overlay Notes..." rows="2"></textarea></div>
<div><label style="font-size:.8rem;color:#a9c6e7;">Status</label><input id="f3" placeholder="Status..."/></div>

      <div><label style="font-size:.8rem;color:#a9c6e7;">Category</label><select id="fcat"><option>Intro</option><option>Game</option><option>Chat</option><option>BRB</option><option>Outro</option></select></div>
      <div><label style="font-size:.8rem;color:#a9c6e7;">Star?</label><select id="fstar"><option value="0">No</option><option value="1">Yes ⭐</option></select></div>
    </div>
    <button class="btn primary" id="addBtn">+ Add Scene</button>
  </section>
  <section class="card">
    <div class="row" style="margin-bottom:10px;">
      <input id="sq" placeholder="Search..." style="flex:1;"/>
      <select id="filterCat" style="max-width:160px;"><option value="">All categories</option><option>Intro</option><option>Game</option><option>Chat</option><option>BRB</option><option>Outro</option></select>
      <button class="btn ghost sm" id="expBtn">Export</button>
      <button class="btn danger sm" id="clrBtn">Clear All</button>
    </div>
          <div class="sort-row" style="margin-bottom:8px;">
        Sort: <button class="sort-btn active" id="sortNew">Newest</button>
        <button class="sort-btn" id="sortOld">Oldest</button>
        <button class="sort-btn" id="sortAZ">A-Z</button>
        <span style="margin-left:auto;font-size:.78rem;" id="countLabel">0 items</span>
      </div>
      <div class="bulk-bar" id="bulkBar" style="display:none;">
        <span id="selCount">0 selected</span>
        <button class="btn danger sm" id="bulkDeleteBtn">Delete Selected</button>
        <button class="sort-btn" id="cancelSelBtn">Cancel</button>
      </div>
      <div id="list"></div>
  </section>
<script>
(function(){
  var KEY='krishiv_stream_scene_v1';
  var items=[];
  try{items=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(items))items=[];}catch(e){items=[];}
  function save(){localStorage.setItem(KEY,JSON.stringify(items));}
  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function ago(ts){var d=Date.now()-ts;if(d<6e4)return'just now';if(d<36e5)return Math.floor(d/6e4)+'m ago';if(d<864e5)return Math.floor(d/36e5)+'h ago';return Math.floor(d/864e5)+'d ago';}
  var labels=["Scene Name", "Duration", "Overlay Notes", "Status"];
  document.getElementById('addBtn').addEventListener('click',function(){
    var vals=[(document.getElementById('f0')||{value:''}).value.trim() + ',' + (document.getElementById('f1')||{value:''}).value.trim() + ',' + (document.getElementById('f2')||{value:''}).value.trim() + ',' + (document.getElementById('f3')||{value:''}).value.trim()];
    if(!vals[0]){alert('Fill the first field!');return;}
    var cat=document.getElementById('fcat')?document.getElementById('fcat').value:'';
    var star=document.getElementById('fstar')&&document.getElementById('fstar').value==='1';
    items.unshift({id:Date.now().toString(36),vals:vals,cat:cat,star:star,ts:Date.now()});
    save();render();
    var e0=document.getElementById('f0');if(e0)e0.value=''; var e1=document.getElementById('f1');if(e1)e1.value=''; var e2=document.getElementById('f2');if(e2)e2.value=''; var e3=document.getElementById('f3');if(e3)e3.value='';
  });
  document.getElementById("filterCat").addEventListener("change",render);
  document.getElementById('sq').addEventListener('input',render);
  document.getElementById('clrBtn').addEventListener('click',function(){if(!confirm('Clear all?'))return;items=[];save();render();});
  document.getElementById('expBtn').addEventListener('click',function(){
    var rows=[labels.join(',')].concat(items.map(function(it){return it.vals.map(function(v){return '"'+String(v||'').replace(/"/g,'""')+'"';}).join(',');}));
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));a.download='stream_scene_v1.csv';a.click();
  });
  function render(){
    var q=document.getElementById('sq').value.toLowerCase();
    var fc=document.getElementById("filterCat")?document.getElementById("filterCat").value:"";
    var vis=items.filter(function(it){
      if(fc&&it.cat!==fc)return false;
      if(q&&it.vals.join(' ').toLowerCase().indexOf(q)<0)return false;
      return true;
    });
    var week=Date.now()-7*864e5;
    document.getElementById('sTotal').textContent=items.length;
    document.getElementById('sThis').textContent=items.filter(function(it){return it.ts>week;}).length;
    document.getElementById('sStar').textContent=items.filter(function(it){return it.star;}).length;
    var el=document.getElementById('list');
    if(!vis.length){el.innerHTML='<div class="empty">No scenes yet. Add one above!</div>';return;}
    el.innerHTML=vis.map(function(it){
      var metas=it.vals.slice(1).map(function(v,i){return v?'<span class="item-meta">'+labels[i+1]+': '+esc(v)+'</span>':''}).join('');
      return '<div class="item">'+
        '<div style="font-size:1.6rem;flex:0 0 36px">🎬</div>'+
        '<div class="item-info">'+
          '<p class="item-title">'+(it.star?'⭐ ':'')+esc(it.vals[0]||'Untitled')+'</p>'+
          metas+
          (it.cat?'<span class="badge">'+esc(it.cat)+'</span>':'')+
          '<span style="font-size:.7rem;color:#6b8fad;margin-left:6px;font-family:monospace">'+ago(it.ts)+'</span>'+
        '</div>'+
        '<div class="row" style="flex:0 0 auto">'+
          '<button class="btn ghost sm" onclick="ts(''+it.id+'')">'+(it.star?'★':'☆')+'</button>'+
          '<button class="btn danger sm" onclick="dl(''+it.id+'')">🗑</button>'+
        '</div>'+
      '</div>';
    }).join('');
  }
  window.dl=function(id){if(!confirm('Delete?'))return;items=items.filter(function(x){return x.id!==id;});save();render();};
  window.ts=function(id){var it=items.find(function(x){return x.id===id;});if(it){it.star=!it.star;save();render();}};
  render();

  // Sort state
  var sortMode='new';
  document.getElementById('sortNew').addEventListener('click',function(){sortMode='new';setSortActive('sortNew');render();});
  document.getElementById('sortOld').addEventListener('click',function(){sortMode='old';setSortActive('sortOld');render();});
  document.getElementById('sortAZ').addEventListener('click',function(){sortMode='az';setSortActive('sortAZ');render();});
  function setSortActive(id){['sortNew','sortOld','sortAZ'].forEach(function(s){var el=document.getElementById(s);if(el)el.classList.toggle('active',s===id);});};

  // Selection / bulk delete
  var selected=new Set();
  function toggleSelect(id){if(selected.has(id))selected.delete(id);else selected.add(id);updateBulkBar();}
  function updateBulkBar(){var bb=document.getElementById('bulkBar'),sc=document.getElementById('selCount');if(bb&&sc){bb.style.display=selected.size>0?'flex':'none';sc.textContent=selected.size+' selected';}}
  var bd=document.getElementById('bulkDeleteBtn');if(bd)bd.addEventListener('click',function(){if(!confirm('Delete '+selected.size+' items?'))return;items=items.filter(function(x){return!selected.has(x.id);});selected.clear();save();render();updateBulkBar();});
  var cs=document.getElementById('cancelSelBtn');if(cs)cs.addEventListener('click',function(){selected.clear();render();updateBulkBar();});

  // Patch render to use sort and show count
  var _origRender=render;
  render=function(){
    var q=document.getElementById('sq')?document.getElementById('sq').value.toLowerCase():'';
    var fc=document.getElementById('filterCat')?document.getElementById('filterCat').value:'';
    var vis=items.filter(function(it){
      if(fc&&it.cat!==fc)return false;
      if(q&&it.vals.join(' ').toLowerCase().indexOf(q)<0)return false;
      return true;
    });
    if(sortMode==='old')vis=vis.slice().reverse();
    else if(sortMode==='az')vis=vis.slice().sort(function(a,b){return(a.vals[0]||'').localeCompare(b.vals[0]||'');});
    var cl=document.getElementById('countLabel');if(cl)cl.textContent=vis.length+' of '+items.length+' items';
    var week=Date.now()-7*864e5;
    var st=document.getElementById('sTotal');if(st)st.textContent=items.length;
    var sw=document.getElementById('sThis');if(sw)sw.textContent=items.filter(function(it){return it.ts>week;}).length;
    var ss=document.getElementById('sStar');if(ss)ss.textContent=items.filter(function(it){return it.star;}).length;
    var el=document.getElementById('list');
    if(!el)return;
    if(!vis.length){el.innerHTML='<div style="color:#a9c6e7;border:1px dashed #365f88;border-radius:12px;padding:24px;text-align:center;">No items yet. Add one above!</div>';return;}
    var labels=el.dataset.labels?JSON.parse(el.dataset.labels):[];
    el.innerHTML=vis.map(function(it){
      var metas=it.vals.slice(1).map(function(v,i){return v?'<span class="item-meta">'+esc(v)+'</span>':'';}).join('');
      var selBox='<input type="checkbox" style="width:auto;margin-right:4px;" '+(selected.has(it.id)?'checked':'')+' onclick="toggleSelect(''+it.id+'')">';
      return '<div class="item" style="'+(selected.has(it.id)?'border-color:rgba(121,216,255,.5);background:rgba(121,216,255,.05);':'')+'">'+
        selBox+
        '<div class="item-info">'+
          '<p class="item-title">'+(it.star?'⭐ ':'')+esc(it.vals[0]||'Untitled')+'</p>'+
          metas+
          (it.cat?'<span class="badge">'+esc(it.cat)+'</span>':'')+
        '</div>'+
        '<div class="row" style="flex:0 0 auto">'+
          '<button class="btn ghost sm" onclick="ts(''+it.id+'')">'+(it.star?'★':'☆')+'</button>'+
          '<button class="btn danger sm" onclick="dl(''+it.id+'')">🗑</button>'+
        '</div>'+
      '</div>';
    }).join('');
  };
  render();

})();
</script>
</main>

  <script src="app-catalog.js"></script>
  <script src="app-universe-shell.js" defer></script>
  <script src="usage-tracker.js" defer></script>
</body></html>
