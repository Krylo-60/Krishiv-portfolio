<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Krishiv PB" />
  <title>Focus Sprint Timer</title>
  <style>
    :root { --bg:#071222; --panel:#10243d; --line:#365c84; --text:#eef6ff; --muted:#a8c2e4; --ok:#54d7a6; --acc:#79d8ff; }
    *{box-sizing:border-box;} body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--text);background:linear-gradient(170deg,#030a14,#0b223b 50%,#13355a);}
    .wrap{width:min(840px,94%);margin:24px auto;}
    .card{border:1px solid var(--line);border-radius:16px;padding:16px;background:linear-gradient(160deg,rgba(17,36,61,.95),rgba(9,22,40,.95));box-shadow:0 20px 40px rgba(0,0,0,.3);margin-bottom:12px;}
    h1,h2,p{margin:0 0 10px;} p{color:var(--muted);}
    .clock{font-size:clamp(2.2rem,9vw,4rem);font-weight:800;letter-spacing:.04em;margin:8px 0 12px;}
    .row{display:flex;gap:8px;flex-wrap:wrap;}
    .btn{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#0a1a30;color:var(--text);font-weight:700;cursor:pointer;}
    .btn.primary{border:none;background:linear-gradient(135deg,var(--acc),var(--ok));color:#032032;}
    .stat{border:1px solid var(--line);border-radius:10px;padding:10px;background:rgba(6,17,31,.75);}
    a{color:#99daff;}
  </style>

  <link rel="stylesheet" href="app-universe-shell.css" />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Focus Sprint Timer</h1>
      <p>Pomodoro style timer for study sessions.</p>
      <p>Created by Krishiv PB</p>
      <a href="index.html#projects">Back to portfolio</a>
    </section>

    <section class="card">
      <h2 id="modeLabel">Focus Mode</h2>
      <div id="clock" class="clock">25:00</div>
      <div class="row">
        <input id="focusMinutes" type="number" min="5" max="120" value="25" style="max-width:140px;" />
        <input id="breakMinutes" type="number" min="1" max="60" value="5" style="max-width:140px;" />
        <label style="display:flex;align-items:center;gap:6px;color:var(--muted);"><input id="autoStartNext" type="checkbox" style="width:auto;" /> Auto-start next mode</label>
        <button id="applyDurationsBtn" class="btn" type="button">Apply Durations</button>
      </div>
      <div class="row">
        <button id="startBtn" class="btn primary" type="button">Start</button>
        <button id="pauseBtn" class="btn" type="button">Pause</button>
        <button id="resetBtn" class="btn" type="button">Reset</button>
        <button id="skipBtn" class="btn" type="button">Skip Mode</button>
      </div>
      <p id="statusText" style="margin-top:10px;">Ready to focus.</p>
    </section>

    <section class="card">
      <div class="row">
        <div class="stat"><strong id="sessionCount">0</strong><div>Focus sessions completed</div></div>
        <div class="stat"><strong id="currentMode">Focus</strong><div>Current mode</div></div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "krishiv_focus_timer_sessions_v1";
      const FOCUS_SECONDS = 25 * 60;
      const BREAK_SECONDS = 5 * 60;

      const clock = document.getElementById("clock");
      const modeLabel = document.getElementById("modeLabel");
      const currentMode = document.getElementById("currentMode");
      const sessionCountNode = document.getElementById("sessionCount");
      const statusText = document.getElementById("statusText");
      const startBtn = document.getElementById("startBtn");
      const pauseBtn = document.getElementById("pauseBtn");
      const resetBtn = document.getElementById("resetBtn");
      const skipBtn = document.getElementById("skipBtn");
      const focusMinutesInput = document.getElementById("focusMinutes");
      const breakMinutesInput = document.getElementById("breakMinutes");
      const autoStartNext = document.getElementById("autoStartNext");
      const applyDurationsBtn = document.getElementById("applyDurationsBtn");
      const SETTINGS_KEY = "krishiv_focus_timer_settings_v1";

      let isFocus = true;
      let focusSeconds = FOCUS_SECONDS;
      let breakSeconds = BREAK_SECONDS;
      let remaining = focusSeconds;
      let timer = null;
      let sessions = Number(localStorage.getItem(STORAGE_KEY) || "0") || 0;
      let settings = { focusMinutes: 25, breakMinutes: 5, autoStart: false };
      try {
        const raw = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
        if (raw && typeof raw === "object") settings = { ...settings, ...raw };
      } catch {}
      focusSeconds = Math.max(5, Number(settings.focusMinutes || 25)) * 60;
      breakSeconds = Math.max(1, Number(settings.breakMinutes || 5)) * 60;
      remaining = focusSeconds;
      focusMinutesInput.value = String(settings.focusMinutes);
      breakMinutesInput.value = String(settings.breakMinutes);
      autoStartNext.checked = Boolean(settings.autoStart);

      function fmt(seconds) {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      }

      function render() {
        clock.textContent = fmt(remaining);
        modeLabel.textContent = isFocus ? "Focus Mode" : "Break Mode";
        currentMode.textContent = isFocus ? "Focus" : "Break";
        sessionCountNode.textContent = String(sessions);
        document.title = (isFocus ? "Focus " : "Break ") + fmt(remaining);
      }

      function stopTimer() {
        if (timer) {
          clearInterval(timer);
          timer = null;
        }
      }

      function switchMode() {
        if (isFocus) {
          sessions += 1;
          localStorage.setItem(STORAGE_KEY, String(sessions));
          statusText.textContent = "Focus complete. Break started.";
        } else {
          statusText.textContent = "Break complete. Focus started.";
        }
        isFocus = !isFocus;
        remaining = isFocus ? focusSeconds : breakSeconds;
        render();
        if (autoStartNext.checked) {
          if (!timer) timer = setInterval(tick, 1000);
          statusText.textContent = isFocus ? "Auto-started focus mode." : "Auto-started break mode.";
        } else {
          stopTimer();
        }
      }

      function tick() {
        remaining -= 1;
        if (remaining <= 0) {
          switchMode();
        }
        render();
      }

      startBtn.addEventListener("click", () => {
        if (timer) return;
        timer = setInterval(tick, 1000);
        statusText.textContent = "Timer running.";
      });

      pauseBtn.addEventListener("click", () => {
        stopTimer();
        statusText.textContent = "Paused.";
      });

      resetBtn.addEventListener("click", () => {
        stopTimer();
        isFocus = true;
        remaining = focusSeconds;
        statusText.textContent = "Reset to focus mode.";
        render();
      });

      skipBtn.addEventListener("click", () => {
        switchMode();
      });

      applyDurationsBtn.addEventListener("click", () => {
        const fm = Math.max(5, Math.min(120, Number(focusMinutesInput.value || 25)));
        const bm = Math.max(1, Math.min(60, Number(breakMinutesInput.value || 5)));
        settings = { focusMinutes: fm, breakMinutes: bm, autoStart: Boolean(autoStartNext.checked) };
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
        focusSeconds = fm * 60;
        breakSeconds = bm * 60;
        if (isFocus) remaining = focusSeconds;
        else remaining = breakSeconds;
        statusText.textContent = "Durations updated.";
        render();
      });

      render();
    })();
  </script>

  <script src="app-universe-shell.js" defer></script>
</body>
</html>
