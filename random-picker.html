<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Krishiv PB" />
  <title>Random Picker | Krishiv PB</title>
  <style>
    :root{--bg:#071223;--panel:#122844;--line:#35608a;--text:#eef7ff;--muted:#abc6e6}
    *{box-sizing:border-box} body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(160deg,#030a14,#0a223a 48%,#123860);color:var(--text)}
    .wrap{width:min(760px,94%);margin:24px auto}.card{border:1px solid var(--line);border-radius:14px;padding:14px;background:linear-gradient(160deg,rgba(18,40,68,.96),rgba(9,22,41,.96));margin-bottom:12px}
    textarea,button{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0a1b31;color:var(--text);font:inherit} textarea{min-height:120px}
    .btn{cursor:pointer;font-weight:700;border:none;background:linear-gradient(135deg,#79d8ff,#58d4a8);color:#032333}.meta{color:var(--muted)} a{color:#9edcff}
  </style>

  <link rel="stylesheet" href="app-universe-shell.css" />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
</head>
<body>
  <main class="wrap">
    <section class="card"><h1>Random Picker</h1><p class="meta">Created by Krishiv PB</p><a href="index.html#projects">Back to portfolio</a></section>
    <section class="card">
      <textarea id="items" placeholder="Enter one item per line"></textarea>
      <button id="pick" class="btn">Pick Random Item</button>
      <h2 id="out">Winner: -</h2>
      <p id="count" class="meta">Items: 0</p>
    </section>
  </main>
  <script>
    (() => {
      const items=document.getElementById("items"), out=document.getElementById("out"), count=document.getElementById("count");
      function list(){ return items.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean); }
      items.addEventListener("input",()=>{ count.textContent="Items: "+list().length; });
      document.getElementById("pick").addEventListener("click",()=>{
        const arr=list(); if(!arr.length){ out.textContent="Winner: add items first"; return; }
        const w=arr[Math.floor(Math.random()*arr.length)]; out.textContent="Winner: "+w;
      });
    })();
  </script>

  <script src="app-universe-shell.js" defer></script>
</body>
</html>
