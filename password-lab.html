<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Krishiv PB" />
  <title>Password Lab | Krishiv PB</title>
  <style>
    :root{--bg:#071223;--panel:#122844;--line:#365f88;--text:#eef7ff;--muted:#aac6e6}
    *{box-sizing:border-box} body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(160deg,#030913,#092038 48%,#123860);color:var(--text)}
    .wrap{width:min(760px,94%);margin:24px auto}.card{border:1px solid var(--line);border-radius:14px;padding:14px;background:linear-gradient(160deg,rgba(18,40,68,.96),rgba(9,22,41,.96));margin-bottom:12px}
    input,button{padding:10px;border-radius:10px;border:1px solid var(--line);background:#0a1b31;color:var(--text);font:inherit}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .btn{cursor:pointer;font-weight:700}.btn.primary{border:none;background:linear-gradient(135deg,#7ad8ff,#58d4a8);color:#032333}.meta{color:var(--muted)} a{color:#9edcff}
    #out{font-family:Consolas,monospace;word-break:break-all}
  </style>

  <link rel="stylesheet" href="app-universe-shell.css" />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
</head>
<body>
  <main class="wrap">
    <section class="card"><h1>Password Lab</h1><p class="meta">Created by Krishiv PB</p><a href="index.html#projects">Back to portfolio</a></section>
    <section class="card">
      <div class="row">
        <label>Length <input id="len" type="number" min="6" max="64" value="16" style="width:100px"></label>
        <label><input id="upper" type="checkbox" checked> Uppercase</label>
        <label><input id="lower" type="checkbox" checked> Lowercase</label>
        <label><input id="num" type="checkbox" checked> Numbers</label>
        <label><input id="sym" type="checkbox" checked> Symbols</label>
      </div>
      <div class="row" style="margin-top:10px"><button class="btn primary" id="genBtn">Generate</button><button class="btn" id="copyBtn">Copy</button></div>
      <p id="out"></p><p id="strength" class="meta"></p>
    </section>
  </main>
  <script>
    (() => {
      const len=document.getElementById("len"), upper=document.getElementById("upper"), lower=document.getElementById("lower"), num=document.getElementById("num"), sym=document.getElementById("sym");
      const out=document.getElementById("out"), strength=document.getElementById("strength"), genBtn=document.getElementById("genBtn"), copyBtn=document.getElementById("copyBtn");
      function pool(){ let p=""; if(upper.checked) p+="ABCDEFGHIJKLMNOPQRSTUVWXYZ"; if(lower.checked) p+="abcdefghijklmnopqrstuvwxyz"; if(num.checked) p+="0123456789"; if(sym.checked) p+="!@#$%^&*()_+[]{}<>?"; return p; }
      function grade(s){ let score=0; if(s.length>=12) score++; if(/[A-Z]/.test(s)) score++; if(/[a-z]/.test(s)) score++; if(/[0-9]/.test(s)) score++; if(/[^A-Za-z0-9]/.test(s)) score++; return score>=5?"Strong":score>=3?"Medium":"Weak"; }
      function generate(){
        const p=pool(); const n=Math.max(6,Math.min(64,Number(len.value)||16)); if(!p){ out.textContent="Select at least one character set."; strength.textContent=""; return; }
        let s=""; for(let i=0;i<n;i++) s += p[Math.floor(Math.random()*p.length)];
        out.textContent=s; strength.textContent="Strength: "+grade(s);
      }
      genBtn.addEventListener("click",generate);
      copyBtn.addEventListener("click", async()=>{ if(!out.textContent) return; try{ await navigator.clipboard.writeText(out.textContent); copyBtn.textContent="Copied"; setTimeout(()=>copyBtn.textContent="Copy",800);}catch{} });
      generate();
    })();
  </script>

  <script src="app-universe-shell.js" defer></script>
</body>
</html>
