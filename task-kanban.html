<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Krishiv PB" />
  <title>Task Kanban | Krishiv PB</title>
  <style>
    :root{--bg:#071223;--panel:#122844;--line:#35608a;--text:#eef7ff;--muted:#a9c6e7}
    *{box-sizing:border-box} body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(160deg,#030a14,#0a223a 48%,#123860);color:var(--text)}
    .wrap{width:min(1080px,95%);margin:24px auto}.card{border:1px solid var(--line);border-radius:14px;padding:14px;background:linear-gradient(160deg,rgba(18,40,68,.96),rgba(9,22,41,.96));margin-bottom:12px}
    .row{display:flex;gap:8px;flex-wrap:wrap} input,button,select{padding:10px;border-radius:10px;border:1px solid var(--line);background:#0a1b31;color:var(--text);font:inherit}
    input{flex:1}.btn{cursor:pointer;font-weight:700;border:none;background:linear-gradient(135deg,#79d8ff,#58d4a8);color:#032333}
    .board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.col{border:1px solid rgba(84,127,172,.4);border-radius:12px;padding:10px;background:rgba(6,17,31,.72)}
    .task{border:1px solid rgba(84,127,172,.5);border-radius:10px;padding:8px;background:#0b1b31;margin-bottom:8px}.meta{color:var(--muted)} a{color:#9edcff}
    .pill{font-size:.75rem;border:1px solid rgba(121,216,255,.5);padding:2px 8px;border-radius:999px;}
    @media (max-width:860px){.board{grid-template-columns:1fr}}
  </style>
  <link rel="stylesheet" href="app-universe-shell.css" />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@400;500;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet" />
  <style id="codex-shared-fonts">
    body, button, input, select, textarea {
      font-family: "Space Grotesk", "Segoe UI", sans-serif !important;
    }

    h1, h2, h3, h4, h5, h6, .brand, .site-title, .logo-text {
      font-family: "Orbitron", "Space Grotesk", sans-serif !important;
    }

    code, pre, .mono, .eyebrow, .card-kicker, .mini-label {
      font-family: "JetBrains Mono", monospace !important;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card"><h1>Task Kanban</h1><p class="meta">Created by Krishiv PB</p><a href="index.html#projects">Back to portfolio</a></section>
    <section class="card">
      <div class="row">
        <input id="taskInput" placeholder="New task title">
        <select id="priority"><option value="High">High</option><option value="Medium" selected>Medium</option><option value="Low">Low</option></select>
        <input id="dueDate" type="date">
        <button id="addBtn" class="btn">Add Task</button>
      </div>
      <div class="row" style="margin-top:8px;">
        <input id="search" placeholder="Search tasks..." />
        <select id="priorityFilter"><option value="all">All Priorities</option><option>High</option><option>Medium</option><option>Low</option></select>
      </div>
      <p id="stats" class="meta"></p>
    </section>
    <section class="board">
      <article class="col"><h2>Todo</h2><div id="todo"></div></article>
      <article class="col"><h2>Doing</h2><div id="doing"></div></article>
      <article class="col"><h2>Done</h2><div id="done"></div></article>
    </section>
  </main>
  <script>
    (() => {
      const key="krishiv_pb_kanban_v2", taskInput=document.getElementById("taskInput"), addBtn=document.getElementById("addBtn"), priority=document.getElementById("priority"), dueDate=document.getElementById("dueDate"), search=document.getElementById("search"), priorityFilter=document.getElementById("priorityFilter"), stats=document.getElementById("stats");
      const columns={todo:document.getElementById("todo"), doing:document.getElementById("doing"), done:document.getElementById("done")};
      let tasks=[];
      dueDate.value = new Date().toISOString().slice(0,10);
      function load(){ try{tasks=JSON.parse(localStorage.getItem(key)||"[]"); if(!Array.isArray(tasks)) tasks=[];}catch{tasks=[];} }
      function save(){ localStorage.setItem(key, JSON.stringify(tasks)); }
      function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
      function move(status){ return status==="todo"?"doing":status==="doing"?"done":"todo"; }
      function isVisible(t){
        const term = search.value.trim().toLowerCase();
        const pf = priorityFilter.value;
        const byTerm = !term || (t.title + " " + t.priority + " " + t.dueDate).toLowerCase().includes(term);
        const byPriority = pf === "all" || t.priority === pf;
        return byTerm && byPriority;
      }
      function render(){
        Object.values(columns).forEach(n=>n.innerHTML="");
        const visible = tasks.filter(isVisible);
        if(!visible.length){ columns.todo.innerHTML='<p class="meta">No tasks match this filter.</p>'; }
        visible.forEach(t=>{
          const el=document.createElement("article"); el.className="task";
          el.innerHTML=`<strong>${esc(t.title)}</strong><div class="meta">Due: ${esc(t.dueDate)} | <span class="pill">${esc(t.priority)}</span></div><div class="row" style="margin-top:6px"><button data-action="next" data-id="${t.id}">Move</button><button data-action="del" data-id="${t.id}">Delete</button></div>`;
          columns[t.status].appendChild(el);
        });
        const doneCount = tasks.filter((t)=>t.status==="done").length;
        stats.textContent = `Total: ${tasks.length} | Completed: ${doneCount} | Completion: ${tasks.length ? Math.round((doneCount / tasks.length) * 100) : 0}%`;
      }
      addBtn.addEventListener("click",()=>{ const v=taskInput.value.trim(); if(v.length<2){alert("Task too short."); return;} tasks.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:v,status:"todo",priority:priority.value,dueDate:dueDate.value || new Date().toISOString().slice(0,10)}); taskInput.value=""; save(); render(); });
      document.body.addEventListener("click",(e)=>{
        const b=e.target; if(!(b instanceof HTMLButtonElement)) return; const id=b.dataset.id, act=b.dataset.action; if(!id||!act) return;
        if(act==="del"){ tasks=tasks.filter(t=>t.id!==id);} else { tasks=tasks.map(t=>t.id===id?{...t,status:move(t.status)}:t); }
        save(); render();
      });
      search.addEventListener("input", render);
      priorityFilter.addEventListener("change", render);
      load(); render();
    })();
  </script>
  <script src="app-universe-shell.js" defer></script>
</body>
</html>
