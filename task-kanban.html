<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Kanban Pro | Krishiv PB</title>
  <link rel="stylesheet" href="app-universe-shell.css" /><link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@400;500;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet" />
  <style id="codex-shared-fonts">body,button,input,select,textarea{font-family:"Space Grotesk",sans-serif!important;}h1,h2,h3{font-family:"Orbitron",sans-serif!important;}code,pre{font-family:"JetBrains Mono",monospace!important;}</style>
  <style>
    :root{--bg:#071223;--line:#35608a;--text:#eef7ff;--muted:#a9c6e7;}
    *{box-sizing:border-box;}body{margin:0;color:var(--text);background:linear-gradient(160deg,#030a14,#0a223a 48%,#123860);min-height:100vh;}
    .wrap{width:min(1080px,95%);margin:24px auto;}
    .card{border:1px solid var(--line);border-radius:14px;padding:16px;background:linear-gradient(160deg,rgba(18,40,68,.96),rgba(9,22,41,.96));margin-bottom:12px;}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
    input,button,select{padding:10px;border-radius:10px;border:1px solid var(--line);background:#0a1b31;color:var(--text);font:inherit;transition:border-color .2s;}
    input:focus,select:focus{outline:none;border-color:#79d8ff;}
    input{flex:1;}.btn{cursor:pointer;font-weight:700;transition:all .2s;}.btn:hover{opacity:.85;}
    .btn.primary{border:none;background:linear-gradient(135deg,#79d8ff,#58d4a8);color:#032333;}
    .btn.sm{width:auto;padding:7px 12px;font-size:.84rem;}
    h1,h2,p{margin:0 0 10px;}p{color:var(--muted);}
    /* BOARD */
    .board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
    .col{border:1px solid rgba(84,127,172,.35);border-radius:14px;padding:12px;background:rgba(6,17,31,.72);min-height:200px;transition:background .2s;}
    .col.drag-over{background:rgba(121,216,255,.06);border-color:rgba(121,216,255,.4);}
    .col-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
    .col-title{font-family:"Orbitron",sans-serif;font-size:.95rem;font-weight:700;}
    .col-badge{font-size:.75rem;background:rgba(255,255,255,.1);border-radius:999px;padding:2px 8px;min-width:22px;text-align:center;}
    /* TASK CARD */
    .task{border:1px solid rgba(84,127,172,.45);border-radius:10px;padding:10px;background:#0b1b31;margin-bottom:8px;cursor:grab;transition:all .2s;position:relative;}
    .task:hover{border-color:rgba(121,216,255,.4);box-shadow:0 4px 16px rgba(0,0,0,.25);}
    .task.dragging{opacity:.4;cursor:grabbing;}
    .task-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
    .task-title{font-weight:600;font-size:.95rem;}
    .task-meta{color:var(--muted);font-size:.8rem;margin-top:4px;}
    .pill{font-size:.72rem;border-radius:999px;padding:2px 8px;border:1px solid;}
    .ph{border-color:rgba(255,107,107,.5);color:#ffd9d9;}.pm{border-color:rgba(255,209,102,.5);color:#fff0c2;}.pl{border-color:rgba(71,211,165,.5);color:#c8ffeb;}
    .due-tag{font-size:.72rem;border-radius:999px;padding:2px 8px;border:1px solid rgba(121,216,255,.3);color:var(--muted);margin-top:4px;display:inline-block;}
    .due-tag.overdue{border-color:rgba(255,107,107,.4);color:#ff9a9a;}
    .task-actions{display:flex;gap:6px;margin-top:8px;}
    .task-actions button{padding:4px 9px;font-size:.78rem;border-radius:8px;}
    /* STATS */
    .stats-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
    .stat-pill{padding:6px 14px;border-radius:999px;border:1px solid var(--line);font-size:.82rem;background:rgba(5,15,28,.6);}
    .stat-pill strong{color:#79d8ff;}
    .empty-col{color:var(--muted);font-size:.85rem;text-align:center;padding:20px 10px;border:1px dashed rgba(84,127,172,.3);border-radius:10px;}
    a{color:#9edcff;}
    @media(max-width:860px){.board{grid-template-columns:1fr;}}
  </style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <h1>📋 Task Kanban Pro</h1>
    <p>Drag and drop tasks between columns. All data saved in your browser.</p>
    <a href="index.html#projects">← Back to portfolio</a>
  </section>

  <section class="card">
    <div class="row">
      <input id="taskInput" placeholder="New task title..." maxlength="80" />
      <select id="priority" style="flex:none;min-width:120px;">
        <option value="High">🔴 High</option>
        <option value="Medium" selected>🟡 Medium</option>
        <option value="Low">🟢 Low</option>
      </select>
      <input id="dueDate" type="date" style="flex:none;min-width:140px;" />
      <button id="addBtn" class="btn primary" style="flex:none;">Add Task</button>
    </div>
    <div class="row" style="margin-top:8px;">
      <input id="search" placeholder="Search tasks..." style="max-width:240px;" />
      <select id="priorityFilter" style="flex:none;min-width:140px;">
        <option value="all">All Priorities</option>
        <option>High</option><option>Medium</option><option>Low</option>
      </select>
      <button id="clearDone" class="btn sm">Clear Done</button>
    </div>
    <div class="stats-row" id="statsRow"></div>
  </section>

  <section class="board" id="board">
    <article class="col" id="col-todo" data-col="todo">
      <div class="col-header">
        <span class="col-title">📌 Todo</span>
        <span class="col-badge" id="badge-todo">0</span>
      </div>
      <div id="todo"></div>
    </article>
    <article class="col" id="col-doing" data-col="doing">
      <div class="col-header">
        <span class="col-title">⚡ Doing</span>
        <span class="col-badge" id="badge-doing">0</span>
      </div>
      <div id="doing"></div>
    </article>
    <article class="col" id="col-done" data-col="done">
      <div class="col-header">
        <span class="col-title">✅ Done</span>
        <span class="col-badge" id="badge-done">0</span>
      </div>
      <div id="done"></div>
    </article>
  </section>
</main>
<script>
(() => {
  const SK="krishiv_kanban_v3";
  let tasks=[], dragId=null;
  const $=id=>document.getElementById(id);
  const cols={todo:$("todo"),doing:$("doing"),done:$("done")};

  function load(){try{tasks=JSON.parse(localStorage.getItem(SK)||"[]");if(!Array.isArray(tasks))tasks=[];}catch{tasks=[];}}
  function save(){localStorage.setItem(SK,JSON.stringify(tasks));}
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function isOverdue(t){return t.dueDate&&t.status!=="done"&&new Date(t.dueDate+"T23:59:59")<new Date();}
  function fmtDate(v){if(!v)return"";const d=new Date(v+"T00:00:00");return isNaN(d)?v:d.toLocaleDateString("en-IN",{day:"2-digit",month:"short"});}
  function pClass(p){return p==="High"?"ph":p==="Medium"?"pm":"pl";}
  function move(s){return s==="todo"?"doing":s==="doing"?"done":"todo";}
  function isVisible(t){
    const q=$("search").value.toLowerCase().trim();
    const pf=$("priorityFilter").value;
    return(!q||(t.title+" "+t.priority+" "+(t.dueDate||"")).toLowerCase().includes(q))&&(pf==="all"||t.priority===pf);
  }

  function render(){
    Object.values(cols).forEach(c=>c.innerHTML="");
    const vis=tasks.filter(isVisible);
    const counts={todo:0,doing:0,done:0};
    vis.forEach(t=>{
      counts[t.status]=(counts[t.status]||0)+1;
      const ov=isOverdue(t);
      const el=document.createElement("article");
      el.className="task";el.dataset.id=t.id;el.draggable=true;
      el.innerHTML=`
        <div class="task-top">
          <span class="task-title">${esc(t.title)}</span>
          <span class="pill ${pClass(t.priority)}">${esc(t.priority)}</span>
        </div>
        ${t.dueDate?`<div class="task-meta">Due: <span class="due-tag${ov?" overdue":""}">${esc(fmtDate(t.dueDate))}${ov?" ⚠":""}</span></div>`:""}
        <div class="task-actions">
          <button data-action="move" data-id="${t.id}">→ Move</button>
          <button data-action="del" data-id="${t.id}">🗑 Delete</button>
        </div>`;
      // Drag events
      el.addEventListener("dragstart",()=>{dragId=t.id;setTimeout(()=>el.classList.add("dragging"),0);});
      el.addEventListener("dragend",()=>{el.classList.remove("dragging");dragId=null;document.querySelectorAll(".col").forEach(c=>c.classList.remove("drag-over"));});
      cols[t.status].appendChild(el);
    });
    // Badges
    ["todo","doing","done"].forEach(s=>{
      $("badge-"+s).textContent=String(counts[s]||0);
      if(!counts[s])cols[s].innerHTML='<div class="empty-col">Drop tasks here</div>';
    });
    // Stats
    const total=tasks.length,done=tasks.filter(t=>t.status==="done").length;
    $("statsRow").innerHTML=`
      <span class="stat-pill">Total: <strong>${total}</strong></span>
      <span class="stat-pill">Todo: <strong>${tasks.filter(t=>t.status==="todo").length}</strong></span>
      <span class="stat-pill">Doing: <strong>${tasks.filter(t=>t.status==="doing").length}</strong></span>
      <span class="stat-pill">Done: <strong>${done}</strong></span>
      <span class="stat-pill">Completion: <strong>${total?Math.round((done/total)*100):0}%</strong></span>`;
  }

  // Drag-and-drop on columns
  document.querySelectorAll(".col").forEach(col=>{
    col.addEventListener("dragover",e=>{e.preventDefault();col.classList.add("drag-over");});
    col.addEventListener("dragleave",()=>col.classList.remove("drag-over"));
    col.addEventListener("drop",e=>{
      e.preventDefault();col.classList.remove("drag-over");
      if(!dragId)return;
      const newStatus=col.dataset.col;
      tasks=tasks.map(t=>t.id===dragId?{...t,status:newStatus}:t);
      save();render();
    });
  });

  $("addBtn").addEventListener("click",()=>{
    const v=$("taskInput").value.trim();if(v.length<2){alert("Task too short.");return;}
    tasks.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:v,status:"todo",priority:$("priority").value,dueDate:$("dueDate").value||""});
    $("taskInput").value="";save();render();
  });
  $("taskInput").addEventListener("keydown",e=>{if(e.key==="Enter")$("addBtn").click();});

  document.body.addEventListener("click",e=>{
    const b=e.target.closest("[data-action]");if(!b)return;
    const{action,id}=b.dataset;
    if(action==="del"){tasks=tasks.filter(t=>t.id!==id);}
    else if(action==="move"){tasks=tasks.map(t=>t.id===id?{...t,status:move(t.status)}:t);}
    save();render();
  });
  $("search").addEventListener("input",render);
  $("priorityFilter").addEventListener("change",render);
  $("clearDone").addEventListener("click",()=>{tasks=tasks.filter(t=>t.status!=="done");save();render();});

  load();render();
})();
</script>
<script src="app-catalog.js"></script>
<script src="app-universe-shell.js" defer></script>
</body>
</html>
