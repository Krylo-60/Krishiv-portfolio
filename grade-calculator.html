<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grade Calculator Pro | Krishiv PB</title>
  <link rel="stylesheet" href="app-universe-shell.css" /><link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@400;500;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet" />
  <style id="codex-shared-fonts">body,button,input,select,textarea{font-family:"Space Grotesk",sans-serif!important;}h1,h2,h3{font-family:"Orbitron",sans-serif!important;}code,pre{font-family:"JetBrains Mono",monospace!important;}</style>
  <style>
    :root{--bg:#06132a;--line:#33597f;--text:#eef6ff;--muted:#a6c2e3;--acc:#6fd3ff;--ok:#55d8a9;}
    *{box-sizing:border-box;}body{margin:0;color:var(--text);background:linear-gradient(165deg,#04101b,#0b233c 50%,#12345b);min-height:100vh;}
    .wrap{width:min(960px,94%);margin:24px auto;}
    .card{background:linear-gradient(160deg,rgba(16,38,63,.95),rgba(8,20,38,.95));border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:0 18px 38px rgba(0,0,0,.28);}
    h1,h2,p{margin:0 0 10px;}p{color:var(--muted);}
    input,button,select{border-radius:10px;border:1px solid var(--line);background:#08192d;color:var(--text);padding:10px;font:inherit;transition:border-color .2s;}
    input:focus,select:focus{outline:none;border-color:var(--acc);}
    button{font-weight:700;cursor:pointer;transition:all .2s;}.btn:hover{opacity:.85;}
    .btn.primary{background:linear-gradient(135deg,var(--acc),var(--ok));color:#032033;border:none;}
    .btn.sm{padding:7px 12px;font-size:.85rem;}
    .add-row{display:grid;gap:8px;grid-template-columns:2fr 1fr 1fr auto;align-items:end;margin-bottom:10px;}
    table{width:100%;border-collapse:collapse;margin-top:10px;}
    th,td{border-bottom:1px solid rgba(110,162,215,.2);padding:9px 8px;text-align:left;font-size:.92rem;}
    th{color:var(--muted);font-size:.82rem;font-family:"JetBrains Mono",monospace;letter-spacing:.06em;}
    .results-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
    .result-card{padding:14px;border-radius:12px;border:1px solid var(--line);background:rgba(6,18,32,.7);text-align:center;}
    .result-card strong{display:block;font-family:"Orbitron",sans-serif;font-size:1.5rem;color:var(--acc);}
    .result-card span{font-size:.8rem;color:var(--muted);}
    .grade-badge{display:inline-block;font-family:"Orbitron",sans-serif;font-size:2rem;font-weight:800;padding:4px 0;}
    /* GPA scale */
    .gpa-toggle{display:flex;gap:6px;margin-bottom:14px;}
    .gpa-tab{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:#08192d;color:var(--muted);cursor:pointer;text-align:center;font-weight:600;transition:all .2s;}
    .gpa-tab.active{background:rgba(111,211,255,.12);border-color:var(--acc);color:var(--acc);}
    /* Progress bars per subject */
    .sub-bar{height:4px;border-radius:999px;background:rgba(255,255,255,.08);margin-top:4px;}
    .sub-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#6fd3ff,#55d8a9);}
    /* History */
    .hist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:8px;}
    .hist-item{padding:10px;border-radius:10px;border:1px solid var(--line);text-align:center;background:rgba(5,15,28,.75);}
    .hist-item strong{display:block;font-family:"Orbitron",sans-serif;font-size:1rem;color:var(--acc);}
    .hist-item span{font-size:.72rem;color:var(--muted);}
    a{color:#9fd8ff;}
    @media(max-width:640px){.add-row{grid-template-columns:1fr;}.results-grid{grid-template-columns:1fr;}}
  </style>
</head>
<body class="app-theme-root">
<main class="wrap">
  <section class="card">
    <h1>📊 Grade Calculator Pro</h1>
    <p>Weighted percentage, GPA scale toggle, grade bands, and session history.</p>
    <a href="index.html#projects">← Back to portfolio</a>
  </section>

  <section class="card">
    <div class="gpa-toggle">
      <div class="gpa-tab active" data-scale="pct" id="tabPct">Percentage (%)</div>
      <div class="gpa-tab" data-scale="gpa4" id="tabGpa4">GPA 4.0 Scale</div>
      <div class="gpa-tab" data-scale="letter" id="tabLetter">Letter Grade</div>
    </div>

    <h2>Add Subject</h2>
    <div class="add-row">
      <div><label style="font-size:.82rem;color:var(--muted);">Subject</label><input id="gcSubject" placeholder="Mathematics" maxlength="40" style="width:100%;margin-top:4px;" /></div>
      <div><label style="font-size:.82rem;color:var(--muted);">Score %</label><input id="gcScore" type="number" min="0" max="100" placeholder="85" style="width:100%;margin-top:4px;" /></div>
      <div><label style="font-size:.82rem;color:var(--muted);">Weight %</label><input id="gcWeight" type="number" min="1" max="100" placeholder="20" style="width:100%;margin-top:4px;" /></div>
      <div style="padding-top:20px;"><button id="gcAdd" class="btn primary" style="width:100%;min-width:80px;">Add</button></div>
    </div>

    <table>
      <thead><tr><th>Subject</th><th>Score</th><th>Weight</th><th>Contribution</th><th></th></tr></thead>
      <tbody id="gcRows"></tbody>
    </table>
    <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
      <button id="gcClear" class="btn sm">Clear All</button>
      <button id="gcSaveHist" class="btn sm">💾 Save to History</button>
    </div>
  </section>

  <section class="card">
    <h2>Results</h2>
    <div class="results-grid">
      <div class="result-card"><strong id="resScore">0%</strong><span>Weighted Score</span></div>
      <div class="result-card"><div class="grade-badge" id="resGrade">—</div><span id="resScaleLabel">Grade</span></div>
      <div class="result-card"><strong id="resSubjects">0</strong><span>Subjects</span></div>
    </div>
    <div style="margin-top:4px;">
      <div style="font-size:.85rem;color:var(--muted);margin-bottom:4px;">Grade Band Reference</div>
      <div id="gradeBandRef" style="font-size:.82rem;color:var(--muted);font-family:'JetBrains Mono',monospace;"></div>
    </div>
  </section>

  <section class="card">
    <h2>Grade History</h2>
    <div class="hist-grid" id="histGrid"></div>
    <button id="clearHist" class="btn sm" style="margin-top:10px;">Clear History</button>
  </section>
</main>
<script>
(() => {
  const SK="krishiv_gc_v2", HK="krishiv_gc_hist_v1";
  let data=[], scale="pct", hist=[];
  const $=id=>document.getElementById(id);
  function load(){
    try{data=JSON.parse(localStorage.getItem(SK)||"[]");if(!Array.isArray(data))data=[];}catch{data=[];}
    try{hist=JSON.parse(localStorage.getItem(HK)||"[]");if(!Array.isArray(hist))hist=[];}catch{hist=[];}
  }
  function save(){localStorage.setItem(SK,JSON.stringify(data));}
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

  function toGpa4(n){return n>=90?4.0:n>=85?3.7:n>=80?3.3:n>=75?3.0:n>=70?2.7:n>=65?2.3:n>=60?2.0:n>=55?1.7:n>=50?1.0:0.0;}
  function toLetter(n){return n>=90?"A+":n>=80?"A":n>=70?"B":n>=60?"C":n>=50?"D":"F";}
  function gradeBands(){
    if(scale==="pct")return"90-100: A+ · 80-89: A · 70-79: B · 60-69: C · 50-59: D · <50: F";
    if(scale==="gpa4")return"4.0=A+ · 3.7=A · 3.3=A- · 3.0=B+ · 2.7=B · 2.3=B- · 2.0=C+ · <2.0=C/D/F";
    return"A+ ≥90% · A ≥80% · B ≥70% · C ≥60% · D ≥50% · F <50%";
  }
  function calcResult(){
    const totalW=data.reduce((a,b)=>a+Number(b.weight||0),0);
    const sum=data.reduce((a,b)=>a+(Number(b.score||0)*Number(b.weight||0)),0);
    return totalW?sum/totalW:0;
  }
  function formatResult(n){
    if(scale==="pct")return n.toFixed(1)+"%";
    if(scale==="gpa4")return toGpa4(n).toFixed(1)+" GPA";
    return toLetter(n);
  }

  function render(){
    const res=calcResult();
    $("resScore").textContent=res.toFixed(1)+"%";
    $("resGrade").textContent=formatResult(res);
    $("resSubjects").textContent=String(data.length);
    $("gradeBandRef").textContent=gradeBands();
    $("resScaleLabel").textContent=scale==="pct"?"Percentage":scale==="gpa4"?"GPA 4.0":"Letter Grade";

    $("gcRows").innerHTML=data.map(r=>{
      const contrib=Number(r.weight)?((Number(r.score)*Number(r.weight))/Number(r.weight)).toFixed(1):0;
      return`<tr>
        <td>${esc(r.subject)}<div class="sub-bar"><div class="sub-fill" style="width:${r.score}%"></div></div></td>
        <td>${r.score}%</td>
        <td>${r.weight}%</td>
        <td>${r.score}%</td>
        <td><button data-del="${r.id}" style="padding:4px 8px;font-size:.8rem;">🗑</button></td>
      </tr>`;
    }).join("");

    renderHist();
  }

  function renderHist(){
    if(!hist.length){$("histGrid").innerHTML='<p style="color:var(--muted);font-size:.85rem;">No saved results yet.</p>';return;}
    $("histGrid").innerHTML=hist.map(h=>`<div class="hist-item"><strong>${h.score}</strong><span>${h.scale}</span><span>${h.date}</span></div>`).join("");
  }

  $("gcAdd").addEventListener("click",()=>{
    const s=$("gcSubject").value.trim(),sc=Number($("gcScore").value),w=Number($("gcWeight").value);
    if(s.length<1||sc<0||sc>100||w<1||w>100){alert("Enter valid subject, score (0–100), and weight (1–100).");return;}
    data.push({id:Date.now().toString(36),subject:s,score:sc,weight:w});
    $("gcSubject").value="";$("gcScore").value="";$("gcWeight").value="";
    save();render();
  });
  $("gcRows").addEventListener("click",e=>{
    const b=e.target.closest("[data-del]");if(!b)return;
    data=data.filter(x=>x.id!==b.dataset.del);save();render();
  });
  $("gcClear").addEventListener("click",()=>{data=[];save();render();});
  $("gcSaveHist").addEventListener("click",()=>{
    if(!data.length){alert("Add subjects first.");return;}
    const res=calcResult();
    hist.unshift({score:formatResult(res),scale:scale==="pct"?"Pct":scale==="gpa4"?"GPA":"Letter",date:new Date().toLocaleDateString("en-IN")});
    if(hist.length>12)hist=hist.slice(0,12);
    localStorage.setItem(HK,JSON.stringify(hist));
    renderHist();alert("Saved to history!");
  });
  $("clearHist").addEventListener("click",()=>{hist=[];localStorage.setItem(HK,"[]");renderHist();});
  document.querySelectorAll(".gpa-tab").forEach(t=>t.addEventListener("click",()=>{
    scale=t.dataset.scale;
    document.querySelectorAll(".gpa-tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");render();
  }));

  load();render();
})();
</script>
  <script src="app-catalog.js"></script>
  <script src="app-universe-shell.js" defer></script>
  <script src="usage-tracker.js" defer></script>
  <script src="future-upgrade.js" defer></script>
</body>
</html>
