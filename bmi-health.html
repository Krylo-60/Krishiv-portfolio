<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Krishiv PB" />
  <title>BMI Health Checker | Krishiv PB</title>
  <style>
    :root{--bg:#071223;--panel:#122844;--line:#35608a;--text:#eef7ff;--muted:#a9c5e6}
    *{box-sizing:border-box} body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(160deg,#030a14,#0a223a 48%,#12385f);color:var(--text)}
    .wrap{width:min(760px,94%);margin:24px auto}.card{border:1px solid var(--line);border-radius:14px;padding:14px;background:linear-gradient(160deg,rgba(18,40,68,.96),rgba(9,22,41,.96));margin-bottom:12px}
    .row{display:flex;gap:8px;flex-wrap:wrap} input,button{padding:10px;border-radius:10px;border:1px solid var(--line);background:#0a1b31;color:var(--text);font:inherit}
    .btn{cursor:pointer;font-weight:700;border:none;background:linear-gradient(135deg,#79d8ff,#58d4a8);color:#032333}.meta{color:var(--muted)} a{color:#9edcff}
  </style>

  <link rel="stylesheet" href="app-universe-shell.css" />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
</head>
<body>
  <main class="wrap">
    <section class="card"><h1>BMI Health Checker</h1><p class="meta">Created by Krishiv PB</p><a href="index.html#projects">Back to portfolio</a></section>
    <section class="card">
      <div class="row"><input id="h" type="number" placeholder="Height (cm)"><input id="w" type="number" placeholder="Weight (kg)"><button class="btn" id="calc">Calculate</button></div>
      <h2 id="bmi">BMI: -</h2><p id="cat" class="meta">Enter values to calculate.</p>
    </section>
  </main>
  <script>
    (() => {
      const h=document.getElementById("h"), w=document.getElementById("w"), bmi=document.getElementById("bmi"), cat=document.getElementById("cat");
      document.getElementById("calc").addEventListener("click",()=>{
        const cm=Number(h.value), kg=Number(w.value); if(!Number.isFinite(cm)||!Number.isFinite(kg)||cm<=0||kg<=0){ cat.textContent="Enter valid height and weight."; return; }
        const m=cm/100, v=kg/(m*m); bmi.textContent="BMI: "+v.toFixed(1);
        let c="Underweight"; if(v>=25) c="Overweight"; else if(v>=18.5) c="Healthy";
        cat.textContent="Category: "+c+" (general guidance only)";
      });
    })();
  </script>

  <script src="app-universe-shell.js" defer></script>
</body>
</html>
