    <style>
        :root {
            --accent: #00f2ff;
            --ethereal: #7000ff;
            --bg: #030306;
            --panel: rgba(10, 10, 18, 0.75);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --glow: 0 0 20px rgba(0, 242, 255, 0.3);
        }

        * { box-sizing: border-box; cursor: crosshair; scrollbar-width: none; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; height: 100vh; overflow: hidden; }

        /* --- BACKGROUND LAYERS --- */
        #bg-canvas { position: fixed; inset: 0; z-index: -2; pointer-events: none; }
        .vignette { position: fixed; inset: 0; background: radial-gradient(circle, transparent 20%, #000 100%); z-index: -1; pointer-events: none; }

        /* --- LAYOUT --- */
        .app-container { display: flex; height: 100vh; width: 100vw; }
        
        .sidebar { 
            width: 320px; background: var(--panel); backdrop-filter: blur(50px);
            border-right: 1px solid var(--border); padding: 40px 20px;
            display: flex; flex-direction: column; z-index: 10;
        }

        .main-stage { flex: 1; display: flex; flex-direction: column; position: relative; }

        /* --- SIDEBAR COMPONENTS --- */
        .logo-area { text-align: center; margin-bottom: 50px; }
        .logo-icon { 
            width: 60px; height: 60px; margin: 0 auto 15px; background: linear-gradient(135deg, var(--accent), var(--ethereal));
            border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800;
            box-shadow: 0 0 30px var(--ethereal); border: 1px solid rgba(255,255,255,0.3);
        }

        .mode-btn {
            background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px;
            padding: 15px; margin-bottom: 10px; transition: 0.3s; cursor: pointer; text-align: left;
        }
        .mode-btn:hover { background: rgba(255,255,255,0.1); transform: translateX(5px); border-color: var(--accent); }
        .mode-btn.active { border-color: var(--accent); background: rgba(0, 242, 255, 0.05); box-shadow: var(--glow); }
        .mode-btn h4 { margin: 0; font-size: 11px; letter-spacing: 2px; color: var(--accent); }
        .mode-btn p { margin: 5px 0 0; font-size: 10px; opacity: 0.6; }
        .mini-badge-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0 18px; }
        .mini-badge {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 4px;
            text-align: center;
            font: 700 9px/1.1 "JetBrains Mono", monospace;
            color: #9fd8f0;
            background: rgba(255,255,255,0.03);
        }
        .mini-badge svg { display:block; margin:0 auto 5px; width:14px; height:14px; stroke:var(--accent); fill:none; stroke-width:1.8; }
        .tool-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .tool-btn {
            border: 1px solid var(--border);
            border-radius: 10px;
            background: rgba(255,255,255,0.03);
            color: #b8e9ff;
            font: 700 10px/1.2 "JetBrains Mono", monospace;
            padding: 8px;
            cursor: pointer;
        }

        /* --- CHAT AREA --- */
        #chatWall { flex: 1; overflow-y: auto; padding: 40px 10%; display: flex; flex-direction: column; }
        .msg { margin-bottom: 30px; animation: fadeInUp 0.5s ease forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .role-tag { font-size: 9px; font-weight: 800; letter-spacing: 3px; margin-bottom: 8px; color: var(--accent); }
        .bubble { 
            background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 20px;
            border-radius: 20px; backdrop-filter: blur(10px); line-height: 1.6; font-size: 15px;
        }

        /* --- INPUT BAR --- */
        .input-dock { padding: 30px 10%; background: linear-gradient(transparent, var(--bg)); }
        .input-glass { 
            background: rgba(15, 15, 25, 0.8); border: 1px solid var(--border); border-radius: 25px;
            padding: 10px 15px 10px 25px; display: flex; align-items: center; backdrop-filter: blur(40px);
        }
        #userInput { flex: 1; background: transparent; border: none; color: #fff; font-size: 15px; font-family: inherit; }
        .send-btn { width: 45px; height: 45px; border-radius: 50%; border: none; background: #fff; color: #000; font-weight: 800; cursor: pointer; transition: 0.3s; }
        .send-btn:hover { transform: scale(1.1); background: var(--accent); }

        /* Markdown Styling */
        pre { background: rgba(0,0,0,0.5) !important; padding: 15px; border-radius: 10px; border: 1px solid var(--border); overflow-x: auto; font-family: 'JetBrains Mono'; }
        code { color: var(--accent); }
    </style>

<body>

<canvas id="bg-canvas"></canvas>
<div class="vignette"></div>

<div class="app-container">
    <aside class="sidebar">
        <div class="logo-area">
            <div class="logo-icon">A</div>
            <h2 style="margin: 10px 0 5px; font-weight: 800;">AETHER CORE</h2>
            <p style="font-size: 9px; letter-spacing: 4px; opacity: 0.5;">OMNI-NODE v2.5</p>
        </div>
        <div class="mini-badge-strip">
            <div class="mini-badge"><svg viewBox="0 0 24 24"><path d="M12 3l8 4v10l-8 4-8-4V7z"/></svg>ORB</div>
            <div class="mini-badge"><svg viewBox="0 0 24 24"><path d="M4 12h16M12 4v16"/></svg>AXIS</div>
            <div class="mini-badge"><svg viewBox="0 0 24 24"><path d="M6 12l4 4 8-8"/></svg>SYNC</div>
            <div class="mini-badge"><svg viewBox="0 0 24 24"><path d="M12 2l3 7h7l-6 4 2 9-6-4-6 4 2-9-6-4h7z"/></svg>PRM</div>
        </div>

        <div class="mode-btn active" onclick="setMode('SYNTHESIS', this)">
            <h4>SYNTHESIS</h4>
            <p>GPT-4 Reasoning Logic</p>
        </div>
        <div class="mode-btn" onclick="setMode('RESEARCH', this)">
            <h4>RESEARCH</h4>
            <p>Perplexity Deep Search</p>
        </div>
        <div class="mode-btn" onclick="setMode('ARCHITECT', this)">
            <h4>ARCHITECT</h4>
            <p>Claude Coding Protocol</p>
        </div>
        <div class="tool-grid">
            <button class="tool-btn" onclick="preset('roadmap')">ROADMAP</button>
            <button class="tool-btn" onclick="preset('review')">REVIEW</button>
            <button class="tool-btn" onclick="copyLast()">COPY LAST</button>
            <button class="tool-btn" onclick="exportChat()">EXPORT</button>
        </div>

        <div style="margin-top: auto; font-family: 'JetBrains Mono'; font-size: 10px;">
            <div style="display:flex; justify-content:space-between; margin-bottom: 5px;">
                <span>ACTIVE_KEYS</span><span id="keyCount">10/10</span>
            </div>
            <div style="height:2px; background:rgba(255,255,255,0.1);"><div id="loadBar" style="width:100%; height:100%; background:var(--accent);"></div></div>
        </div>
    </aside>

    <main class="main-stage">
        <div id="chatWall">
            <div style="margin: auto; text-align: center; opacity: 0.2;">
                <h1 style="font-size: 80px; letter-spacing: 20px;">AETHER</h1>
                <p>READY_FOR_INPUT</p>
            </div>
        </div>

        <div class="input-dock">
            <div class="input-glass">
                <input type="text" id="userInput" placeholder="Synthesize command..." onkeypress="if(event.key==='Enter') execute()">
                <button class="send-btn" onclick="execute()">-></button>
            </div>
        </div>
    </main>
</div>

<script>
    const VIRTUAL_NODE_COUNT = 10;

    let currentIdx = 0;
    let lastAnswer = "";
    let systemMode = "SYNTHESIS";
    const PROMPT_HISTORY_KEY = 'aether_v25_prompt_history';
    let promptHistory = JSON.parse(localStorage.getItem(PROMPT_HISTORY_KEY) || '[]');
    let historyIndex = -1;

    function setMode(m, el) {
        systemMode = m;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
    }

    function render(role, text) {
        const wall = document.getElementById('chatWall');
        if(wall.querySelector('div[style*="opacity: 0.2"]')) wall.innerHTML = '';
        
        const msg = document.createElement('div');
        msg.className = 'msg';
        msg.innerHTML = `<div class="role-tag">${role === 'bot' ? 'AETHER_CORE' : 'SIGNAL_SOURCE'}</div><div class="bubble">${text}</div>`;
        wall.appendChild(msg);
        wall.scrollTop = wall.scrollHeight;
        return msg.querySelector('.bubble');
    }

    async function execute() {
        const input = document.getElementById('userInput');
        const val = input.value.trim();
        if(!val) return;
        promptHistory = [val, ...promptHistory.filter((item) => item !== val)].slice(0, 30);
        localStorage.setItem(PROMPT_HISTORY_KEY, JSON.stringify(promptHistory));
        historyIndex = -1;
        render('user', val);
        input.value = '';
        const loader = render('bot', 'Processing...');

        if (/^[0-9+\-*/().^\%âˆš\s]+$/.test(val) && /[0-9]/.test(val) && val.replace(/\s/g, '').length >= 3) {
            try {
                const safeExpr = val.replace(/\s/g, '').replace(/\^/g, '**').replace(/âˆš/g, 'Math.sqrt');
                const result = eval(safeExpr);
                if (result !== null && result !== undefined && !isNaN(result) && result !== Infinity) {
                    setTimeout(() => {
                        lastAnswer = `The calculated result is: **${result}**`;
                        loader.innerHTML = marked.parse(lastAnswer);
                    }, 600 + Math.random() * 400);
                    return;
                }
            } catch (e) {}
        }

        await fetchAI(val, loader);
    }

    function recallPrompt(step) {
        const input = document.getElementById('userInput');
        if (!input || !promptHistory.length) return;
        if (historyIndex < 0) historyIndex = 0;
        else historyIndex = Math.min(promptHistory.length - 1, Math.max(0, historyIndex + step));
        input.value = promptHistory[historyIndex] || '';
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
    }

    async function fetchAI(prompt, loader) {
            const protocol = `Execute in ${systemMode} mode. Provide structured, expert-level response.`;
        try {
            const res = await fetch("/api/aether/chat", {
                method: "POST", headers: {"Content-Type":"application/json"},
                body: JSON.stringify({
                    prompt,
                    systemPrompt: `${protocol} You are AETHER_CORE v2.5. Respond with concise expert guidance and clear structure.`
                })
            });
            if(!res.ok) {
                const error = await res.json().catch(() => ({}));
                throw new Error(error.error || "NODE_FAILURE");
            }
            const data = await res.json();
            lastAnswer = String(data.text || "");
            loader.innerHTML = marked.parse(data.text || "No response.");
        } catch(e) {
            currentIdx = (currentIdx + 1) % VIRTUAL_NODE_COUNT;
            document.getElementById('keyCount').innerText = `${VIRTUAL_NODE_COUNT - currentIdx}/${VIRTUAL_NODE_COUNT}`;
            setTimeout(() => fetchAI(prompt, loader), 500);
        }
    }

    function preset(kind) {
        const input = document.getElementById('userInput');
        if (kind === "roadmap") input.value = "Create a feature roadmap from MVP to v2 with priorities.";
        if (kind === "review") input.value = "Review this idea and give risks, fixes, and improved architecture.";
        input.focus();
    }

    async function copyLast() {
        if (!lastAnswer) return;
        try { await navigator.clipboard.writeText(lastAnswer); } catch {}
    }

    function exportChat() {
        const text = document.getElementById('chatWall').innerText.trim();
        if (!text) return;
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `aether-v25-chat-${Date.now()}.txt`;
        a.click();
        URL.revokeObjectURL(url);
    }

    document.getElementById('userInput').addEventListener('keydown', (event) => {
        if (event.key === 'ArrowUp') {
            event.preventDefault();
            recallPrompt(1);
            return;
        }
        if (event.key === 'ArrowDown') {
            event.preventDefault();
            if (historyIndex <= 0) {
                historyIndex = -1;
                event.currentTarget.value = '';
                return;
            }
            recallPrompt(-1);
            return;
        }
        if (event.key === 'Tab' && !event.shiftKey) {
            event.preventDefault();
            recallPrompt(historyIndex < 0 ? 0 : 1);
            return;
        }
        historyIndex = -1;
    });

    // --- NEURAL BACKGROUND ENGINE ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    let nodes = Array.from({length: 80}, () => ({x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5}));

    function animate() {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        nodes.forEach((n, i) => {
            n.x += n.vx; n.y += n.vy;
            if(n.x<0 || n.x>canvas.width) n.vx*=-1;
            if(n.y<0 || n.y>canvas.height) n.vy*=-1;
            nodes.slice(i+1).forEach(n2 => {
                let d = Math.hypot(n.x-n2.x, n.y-n2.y);
                if(d < 180) {
                    ctx.strokeStyle = `rgba(0, 242, 255, ${0.15 * (1 - d/180)})`;
                    ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(n.x, n.y); ctx.lineTo(n2.x, n2.y); ctx.stroke();
                }
            });
        });
        requestAnimationFrame(animate);
    }
    animate();
</script>
