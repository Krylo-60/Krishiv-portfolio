<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 140" role="img" aria-labelledby="title desc">
  <title id="title">Clash of Clans logo</title>
  <desc id="desc">Clash of Clans wordmark with glossy shield and war arrow accent.</desc>
  <defs>
    <linearGradient id="cocBg" x1="0" y1="0" x2="1" y2="1">
