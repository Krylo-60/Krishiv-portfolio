<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Review App Project Preview</title>
  <desc id="desc">A neon card layout showing review stars and user comments for a review application.</desc>
  <defs>
    <linearGradient id="bg" x1="100" y1="80" x2="1040" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1F4F"/>
      <stop offset="0.5" stop-color="#131647"/>
      <stop offset="1" stop-color="#061325"/>
    </linearGradient>
    <linearGradient id="aqua" x1="135" y1="160" x2="1050" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DE2FF"/>
      <stop offset="1" stop-color="#3A7BFF"/>
    </linearGradient>
    <linearGradient id="mint" x1="246" y1="285" x2="948" y2="445" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9BFFE4"/>
      <stop offset="1" stop-color="#83F9FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="334" y1="104" x2="947" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B6A2FF"/>
      <stop offset="1" stop-color="#57CAFF"/>
    </linearGradient>
    <filter id="glow" x="223" y="68" width="754" height="525" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="14" result="effect1_foregroundBlur"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="160" cy="110" r="120" fill="#1F64FF" fill-opacity="0.16"/>
  <circle cx="1020" cy="90" r="132" fill="#2DE2FF" fill-opacity="0.12"/>
  <circle cx="1070" cy="620" r="180" fill="#3A7BFF" fill-opacity="0.1"/>
  <circle cx="110" cy="630" r="180" fill="#9B5BFF" fill-opacity="0.14"/>

  <g filter="url(#glow)">
    <rect x="262" y="107" width="676" height="447" rx="34" fill="#050B1D" fill-opacity="0.8" stroke="url(#aqua)" stroke-width="4"/>
  </g>

  <text x="320" y="167" fill="url(#accent)" font-family="Space Grotesk, Arial, sans-serif" font-size="50" font-weight="700" letter-spacing="1.5">
    Review App
  </text>
  <text x="322" y="202" fill="#9CB4F0" font-family="Space Grotesk, Arial, sans-serif" font-size="26" font-weight="500">
    Ratings · Feedback · Quality Tracking
  </text>

  <rect x="314" y="236" width="572" height="88" rx="16" fill="#0B1733" stroke="url(#mint)" stroke-width="2.5"/>
  <text x="344" y="275" fill="#DDE7FF" font-family="Space Grotesk, Arial, sans-serif" font-size="28" font-weight="700">Krishiv</text>
  <text x="346" y="303" fill="#A8B9E9" font-family="JetBrains Mono, monospace" font-size="20">Amazing layout and super clean design.</text>
  <text x="780" y="289" fill="#FFD86A" font-family="Space Grotesk, Arial, sans-serif" font-size="34" font-weight="700">★★★★★</text>

  <rect x="314" y="340" width="572" height="88" rx="16" fill="#0B1733" stroke="#4E70BA" stroke-width="2"/>
  <text x="344" y="378" fill="#DDE7FF" font-family="Space Grotesk, Arial, sans-serif" font-size="28" font-weight="700">PlayerOne</text>
  <text x="346" y="406" fill="#A8B9E9" font-family="JetBrains Mono, monospace" font-size="20">Good app, filtering helps read feedback fast.</text>
  <text x="796" y="392" fill="#FFD86A" font-family="Space Grotesk, Arial, sans-serif" font-size="34" font-weight="700">★★★★☆</text>

  <rect x="314" y="444" width="274" height="76" rx="14" fill="#07142E" stroke="#4D73C0" stroke-width="2"/>
  <rect x="612" y="444" width="274" height="76" rx="14" fill="#07142E" stroke="#4D73C0" stroke-width="2"/>
  <text x="342" y="475" fill="#B8CBFF" font-family="Space Grotesk, Arial, sans-serif" font-size="20">Total Reviews</text>
  <text x="344" y="506" fill="#94FFE0" font-family="JetBrains Mono, monospace" font-size="30" font-weight="700">24</text>
  <text x="638" y="475" fill="#B8CBFF" font-family="Space Grotesk, Arial, sans-serif" font-size="20">Average Rating</text>
  <text x="640" y="506" fill="#93ECFF" font-family="JetBrains Mono, monospace" font-size="30" font-weight="700">4.7</text>
</svg>
