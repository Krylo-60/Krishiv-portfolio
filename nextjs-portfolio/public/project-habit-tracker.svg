  <text x="115" y="177" fill="#86c8d8" font-family="Segoe UI, Arial, sans-serif" font-size="22">Discipline System by Krishiv PB</text>
  <rect x="108" y="210" width="430" height="340" rx="18" fill="#11243c"/>
