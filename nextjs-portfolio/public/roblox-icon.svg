<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 140" role="img" aria-labelledby="title desc">
  <title id="title">Roblox logo</title>
  <desc id="desc">Futuristic Roblox tile with glowing frame and centered diamond mark.</desc>
  <defs>
    <linearGradient id="rbBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="55%" stop-color="#2553f3"/>
      <stop offset="100%" stop-color="#07142b"/>
    </linearGradient>
    <radialGradient id="rbGlow" cx="50%" cy="42%" r="64%">
      <stop offset="0%" stop-color="#9dd8ff" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#9dd8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="rbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#041120" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="300" height="140" rx="24" fill="url(#rbBg)"/>
  <rect width="300" height="140" rx="24" fill="url(#rbGlow)"/>
  <rect x="16" y="14" width="268" height="112" rx="20" fill="none" stroke="rgba(255,255,255,.18)"/>
  <g filter="url(#rbShadow)" transform="translate(150 67)">
    <rect x="-40" y="-40" width="80" height="80" rx="8" fill="#ffffff" transform="rotate(-17)"/>
    <rect x="-12" y="-12" width="24" height="24" rx="2" fill="#2553f3" transform="rotate(-17)"/>
  </g>
  <text x="150" y="122" text-anchor="middle" font-family="Orbitron, Arial Black, Arial, sans-serif" font-size="18" letter-spacing="8" fill="#eef7ff">ROBLOX</text>
</svg>
