<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typing Speed Test Pro | Krishiv PB</title>
  <link rel="stylesheet" href="app-universe-shell.css" /><link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@400;500;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet" />
  <style id="codex-shared-fonts">body,button,input,select,textarea{font-family:"Space Grotesk",sans-serif!important;}h1,h2,h3{font-family:"Orbitron",sans-serif!important;}code,pre{font-family:"JetBrains Mono",monospace!important;}</style>
  <style>
    :root{--bg:#071223;--line:#35608a;--text:#eef7ff;--muted:#aac5e6;--ok:#54d7a6;--bad:#ff7f7f;--acc:#79d8ff;}
    *{box-sizing:border-box;}body{margin:0;color:var(--text);background:linear-gradient(160deg,#030a14,#0a223a 48%,#123860);min-height:100vh;}
    .wrap{width:min(900px,94%);margin:24px auto;}
    .card{border:1px solid var(--line);border-radius:14px;padding:18px;background:linear-gradient(160deg,rgba(18,40,68,.96),rgba(9,22,41,.96));margin-bottom:12px;}
    h1,h2,p{margin:0 0 10px;}p{color:var(--muted);}
    button,select{padding:10px;border-radius:10px;border:1px solid var(--line);background:#0a1b31;color:var(--text);font:inherit;cursor:pointer;font-weight:700;transition:all .2s;}
    button:hover{opacity:.85;transform:translateY(-1px);}
    button.primary{border:none;background:linear-gradient(135deg,#79d8ff,#58d4a8);color:#032333;}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
    .meta{color:var(--muted);font-size:.9rem;}
    a{color:#9edcff;}
    /* Stats row */
    .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0;}
    .stat{padding:10px;border-radius:10px;border:1px solid var(--line);background:rgba(5,15,28,.75);text-align:center;}
    .stat strong{display:block;font-family:"Orbitron",sans-serif;font-size:1.2rem;}
    .stat span{font-size:.74rem;color:var(--muted);}
    /* Target text with character highlights */
    #targetDisplay{font-size:1.15rem;line-height:1.8;padding:14px;border:1px solid var(--line);border-radius:12px;background:rgba(4,14,26,.6);min-height:70px;letter-spacing:.01em;margin-bottom:12px;}
    .ch{display:inline;border-radius:2px;transition:background .1s;}
    .ch.correct{color:#54d7a6;}
    .ch.wrong{color:#ff7f7f;background:rgba(255,127,127,.12);}
    .ch.current{border-bottom:2px solid #79d8ff;animation:blink .7s step-end infinite;}
    @keyframes blink{50%{border-color:transparent;}}
    /* Input */
    #typingInput{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:#0a1b31;color:var(--text);font:inherit;font-size:1rem;outline:none;transition:border-color .2s;resize:none;min-height:80px;}
    #typingInput:focus{border-color:var(--acc);}
    /* Progress */
    .prog-bar{height:6px;border-radius:999px;background:rgba(255,255,255,.08);margin:8px 0;}
    .prog-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#79d8ff,#58d4a8);transition:width .2s;}
    /* Mode tabs */
    .mode-tabs{display:flex;gap:6px;margin-bottom:10px;}
    .mode-tab{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:#0a1b31;color:var(--muted);cursor:pointer;text-align:center;font-weight:600;transition:all .2s;}
    .mode-tab.active{background:rgba(121,216,255,.12);border-color:var(--acc);color:var(--acc);}
    /* Best history */
    .best-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:8px;}
    .best-item{padding:8px;border-radius:10px;border:1px solid var(--line);text-align:center;background:rgba(5,15,28,.75);}
    .best-item strong{display:block;font-family:"Orbitron",sans-serif;font-size:1rem;color:var(--acc);}
    .best-item span{font-size:.74rem;color:var(--muted);}
    @media(max-width:600px){.stats-row{grid-template-columns:repeat(2,1fr);}}
  </style>
</head>
<body class="app-theme-root">
<main class="wrap">
  <section class="card">
    <h1>⌨️ Typing Speed Test Pro</h1>
    <p>Measure your WPM and accuracy with live character highlighting and score history.</p>
    <a href="index.html#projects">← Back to portfolio</a>
  </section>

  <section class="card">
    <!-- Mode tabs -->
    <div class="mode-tabs">
      <div class="mode-tab active" data-mode="quotes" id="modeQuotes">Quotes</div>
      <div class="mode-tab" data-mode="code" id="modeCode">Code</div>
      <div class="mode-tab" data-mode="words" id="modeWords">Word List</div>
    </div>

    <div class="row" style="margin-bottom:12px;">
      <select id="duration"><option value="30">30s</option><option value="60" selected>60s</option><option value="120">2 min</option></select>
      <button id="newTextBtn">New Text</button>
      <button id="resetBtn">Reset</button>
    </div>

    <!-- Character-highlighted target -->
    <div id="targetDisplay"></div>

    <!-- Typing input -->
    <textarea id="typingInput" placeholder="Start typing here to begin the timer..." rows="3" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>

    <!-- Progress -->
    <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>

    <!-- Live stats -->
    <div class="stats-row">
      <div class="stat"><strong id="statWPM">0</strong><span>WPM</span></div>
      <div class="stat"><strong id="statAcc">100%</strong><span>Accuracy</span></div>
      <div class="stat"><strong id="statTime">60s</strong><span>Time Left</span></div>
      <div class="stat"><strong id="statChars">0</strong><span>Chars Typed</span></div>
    </div>

    <p id="resultText" class="meta" style="margin-top:4px;"></p>
    <p class="meta">Best WPM: <strong id="bestWPM">0</strong></p>
  </section>

  <section class="card">
    <h2>Score History</h2>
    <div class="best-grid" id="histGrid"></div>
    <button id="clearHist" style="margin-top:10px;" class="primary" onclick="">Clear History</button>
  </section>
</main>
<script>
(() => {
  const BEST_KEY="krishiv_typing_best_v3", HIST_KEY="krishiv_typing_hist_v1";
  const samples={
    quotes:[
      "JavaScript helps me build interactive websites faster every single week of practice.",
      "Consistent coding habits turn raw ideas into real projects that people can actually use.",
      "Krishiv PB builds apps with speed, creativity, and relentless focus on quality.",
      "Strong habits and smart daily tools create truly excellent student outcomes over time.",
      "The best way to learn programming is to build something real that you actually care about.",
    ],
    code:[
      "const add = (a, b) => a + b; console.log(add(3, 4));",
      "function greet(name) { return `Hello, ${name}! Welcome.`; }",
      "const arr = [1, 2, 3]; const doubled = arr.map(x => x * 2);",
      "document.getElementById('btn').addEventListener('click', () => { alert('clicked!'); });",
      "fetch('/api/data').then(r => r.json()).then(data => console.log(data));",
    ],
    words:[
      "apple banana cherry dragon eagle forest galaxy hero island jungle kingdom legend",
      "velocity portal vortex nexus quantum circuit matrix signal wave orbit nebula pulse",
      "keyboard monitor laptop screen pixel render deploy commit push merge branch clone",
      "focus sprint session timer pomodoro break habit streak daily goal progress track",
    ]
  };

  let mode="quotes", running=false, start=0, timerInterval=null, timeLeft=60, target="", chars=[];
  let best=Number(localStorage.getItem(BEST_KEY)||0);
  let hist=JSON.parse(localStorage.getItem(HIST_KEY)||"[]")||[];
  const $=id=>document.getElementById(id);

  function pick(){const pool=samples[mode];return pool[Math.floor(Math.random()*pool.length)];}

  function buildChars(text){
    chars=text.split("").map(c=>({ch:c,state:"none"}));
    $("targetDisplay").innerHTML=chars.map((c,i)=>{
      const display=c.ch===" "?"&nbsp;":c.ch==="<"?"&lt;":c.ch===">"?"&gt;":c.ch==="&"?"&amp;":c.ch;
      return`<span class="ch" id="ch${i}">${display}</span>`;
    }).join("");
    markCurrent(0);
  }

  function markCurrent(pos){
    document.querySelectorAll(".ch").forEach(el=>el.classList.remove("current"));
    const el=document.getElementById("ch"+pos);if(el)el.classList.add("current");
  }

  function updateChars(typed){
    typed.split("").forEach((c,i)=>{
      const span=document.getElementById("ch"+i);if(!span)return;
      span.classList.remove("correct","wrong");
      if(c===chars[i]?.ch)span.classList.add("correct");
      else span.classList.add("wrong");
    });
    markCurrent(typed.length);
  }

  function calcWPM(typed, elapsedSec){
    const words=typed.trim().split(/\s+/).filter(w=>w.length).length;
    return elapsedSec>0?Math.round((words/elapsedSec)*60):0;
  }
  function calcAcc(typed){
    if(!typed.length)return 100;
    let correct=0;
    typed.split("").forEach((c,i)=>{if(chars[i]&&c===chars[i].ch)correct++;});
    return Math.max(0,Math.round((correct/typed.length)*100));
  }

  function updateLiveStats(){
    if(!running)return;
    const typed=$("typingInput").value;
    const elapsed=(Date.now()-start)/1000;
    const wpm=calcWPM(typed,elapsed);
    const acc=calcAcc(typed);
    const pct=Math.min(100,Math.round((typed.length/target.length)*100));
    $("statWPM").textContent=String(wpm);
    $("statAcc").textContent=acc+"%";
    $("statChars").textContent=String(typed.length);
    $("progFill").style.width=pct+"%";
    updateChars(typed);
  }

  function startRun(){
    running=true;start=Date.now();timeLeft=Number($("duration").value||60);
    $("typingInput").style.borderColor="var(--acc)";
    timerInterval=setInterval(()=>{
      timeLeft--;$("statTime").textContent=timeLeft+"s";
      updateLiveStats();
      if(timeLeft<=0){stopRun(true);}
    },1000);
  }

  function stopRun(timeUp=false){
    running=false;clearInterval(timerInterval);timerInterval=null;
    const typed=$("typingInput").value;
    const elapsed=(Date.now()-start)/1000;
    const wpm=calcWPM(typed,elapsed);
    const acc=calcAcc(typed);
    $("resultText").textContent=timeUp?`⏱ Time up! WPM: ${wpm} | Accuracy: ${acc}%`:`&#x2705; Complete! WPM: ${wpm} | Accuracy: ${acc}%`;
    if(wpm>best){best=wpm;localStorage.setItem(BEST_KEY,String(best));}
    $("bestWPM").textContent=String(best);
    hist.unshift({wpm,acc,mode,date:new Date().toLocaleDateString("en-IN")});
    if(hist.length>12)hist=hist.slice(0,12);
    localStorage.setItem(HIST_KEY,JSON.stringify(hist));
    renderHist();
  }

  function resetTest(newText=false){
    clearInterval(timerInterval);timerInterval=null;running=false;start=0;
    if(newText)target=pick();
    buildChars(target);
    $("typingInput").value="";
    timeLeft=Number($("duration").value||60);
    $("statWPM").textContent="0";$("statAcc").textContent="100%";$("statTime").textContent=timeLeft+"s";
    $("statChars").textContent="0";$("progFill").style.width="0%";
    $("resultText").textContent="";$("typingInput").style.borderColor="var(--line)";
  }

  function renderHist(){
    if(!hist.length){$("histGrid").innerHTML='<p class="meta">No history yet.</p>';return;}
    $("histGrid").innerHTML=hist.map(h=>`<div class="best-item"><strong>${h.wpm}</strong><span>WPM</span><span>${h.acc}% acc</span><span>${h.date}</span></div>`).join("");
  }

  $("typingInput").addEventListener("input",()=>{
    if(!running&&$("typingInput").value.length>0)startRun();
    if(running){
      const typed=$("typingInput").value;
      updateChars(typed);
      if(typed===target)stopRun(false);
    }
  });
  $("newTextBtn").addEventListener("click",()=>resetTest(true));
  $("resetBtn").addEventListener("click",()=>resetTest(false));
  $("duration").addEventListener("change",()=>resetTest(false));
  $("clearHist").addEventListener("click",()=>{hist=[];localStorage.setItem(HIST_KEY,"[]");renderHist();});
  document.querySelectorAll(".mode-tab").forEach(t=>t.addEventListener("click",()=>{
    mode=t.dataset.mode;
    document.querySelectorAll(".mode-tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");resetTest(true);
  }));

  $("bestWPM").textContent=String(best);
  resetTest(true);renderHist();
})();
</script>

  <script src="app-catalog.js"></script>
  <script src="app-universe-shell.js" defer></script>
  <script src="usage-tracker.js" defer></script>
</body>
</html>
